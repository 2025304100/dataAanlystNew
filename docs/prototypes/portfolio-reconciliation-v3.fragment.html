<script>
(()=>{
const root=document.getElementById('rc-v3');
const main=root.querySelector('#rc-main'),layer=root.querySelector('#rc-layer'),workspace=root.querySelector('#rc-workspace'),live=root.querySelector('#rc-live');
const defaults=()=>({scene:'blocked',dataFixed:false,reconFixed:false,bindingFixed:false,confirmed:false,found:false,repair:'idle',baselineAccepted:false,cashUnknown:false,dualUnavailable:false,dualRan:false,dualView:'summary',aiTopic:'all',events:[]});
let s=defaults(),drawer=null,modal=null,returnAction='',modalReturn=null,timer=0;
const sceneNames={blocked:'日常阻断',history:'历史未知 · 当前资产可信',waiting:'自动核对等待回报',healthy:'正常运行',error:'检查读取失败',readonly:'仅查看权限'};
const sceneValue=()=>s.scene==='history'&&s.cashUnknown?'history-cash':s.scene;
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,kind='',disabled=false)=>`<button type="button" class="rc-button cursor-interaction ${kind}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
const link=(label,action)=>`<button type="button" class="rc-link cursor-interaction" data-action="${action}">${label}</button>`;
const tag=(text,type='neutral')=>`<span class="rc-tag rc-${type}">${text}</span>`;
const callout=(title,text,type='')=>`<div class="rc-callout ${type}"><strong>${title}</strong><p>${text}</p></div>`;
const facts=items=>`<dl class="rc-facts">${items.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
const detail=(title,text)=>`<details class="rc-detail"><summary class="cursor-interaction">${title}</summary>${text}</details>`;
const subsection=title=>`<div class="rc-subhead"><h3>${title}</h3></div>`;
const readOnly=()=>s.scene==='readonly';
const isDaily=()=>['blocked','readonly'].includes(s.scene);
const issues=()=>s.scene==='error'?[{id:'error',title:'检查结果读取失败',meta:'检查服务超时 · 当前交易能力无法确认',finish:'重新读取成功后，才能核定运行状态',action:'重新读取',type:'未知'}]:s.scene==='history'&&!s.baselineAccepted?[{id:'history',title:'历史核对中断，旧期证据无法恢复',meta:'2026-09-30 · 旧基线 B02 · 执行回报与资金快照缺失',finish:'先独立核验当前资产，再审核新的覆盖起点',action:'处理历史未知',type:'需审核'}]:isDaily()?[...(!s.reconFixed?[{id:'recon',title:'10 月 20 日执行记录未关联',meta:'自动决策已生成 · 执行来源待核实，无法完成当日核对',finish:'关联可信执行证据 → 重检差异为 0 → 本人审核',action:'核查执行证据',type:'优先处理'}]:[]),...(!s.dataFixed?[{id:'data',title:'平安银行评分缺少 1 个输入指标',meta:'000001 · 10-21 成交量指标缺失，评分仍停留在 10-20',finish:'补齐指定指标并重算评分，再验证时效',action:'查看指标并修复',type:'数据缺失'}]:[]),...(!s.bindingFixed?[{id:'binding',title:'已保存的策略变更尚未完成运行审核',meta:'策略快照 S18 与当前已验收 S17 不同 · 尚未切换',finish:'核实快照用途，保留已验收版本或另行验收',action:'审核策略绑定',type:'绑定待核实'}]:[])]:[];
function health(){
const n=issues().length;
if(s.scene==='error')return {title:'交易状态待核实',sub:'检查结果读取失败，当前限制和可用能力尚不能确认。',mark:'circle-help',state:'状态未知',count:n};
if(s.scene==='history'&&s.baselineAccepted)return {title:'新覆盖起点已建立，等待首次核对',sub:'旧期仍保留“历史未知”；新基线从 10-22 开始，尚无已核验日期。',mark:'clock-3',state:'等待核对',count:0};
if(s.scene==='history')return {title:'历史核对中断，新买入暂停',sub:'09-30 的历史材料无法恢复；先核实当前资产，再审核新的覆盖起点。',mark:'shield-alert',state:'历史待接续',count:n};
if(n)return {title:'新买入已暂停',sub:`${n} 项阻断待处理。${readOnly()?'你可查看证据，由有权限的审核人完成处理。':'建议先'+issues()[0].action+'。'}`,mark:'shield-alert',state:'检查未通过',count:n};
if(isDaily()&&!s.confirmed)return {title:'阻断已清除，等待本人确认',sub:'本次修复已通过重检；审核 R17 v3 后恢复当前组合的新买入。',mark:'user-round-check',state:'待本人确认',count:0};
return {title:s.scene==='waiting'?'当前交易条件正常':'运行条件已满足',sub:s.scene==='waiting'?'10-21 核对正在等待 T+1 执行回报，尚未超时，无需人工补记录。':'当前范围核对通过，可按已验收的引擎链与策略运行。',mark:'shield-check',state:'条件正常',count:0,good:true};
}
function queue(){
if(s.scene==='history')return s.baselineAccepted?[['10-22','待首次核对','yellow','尚无新日期通过']]:[['09-29','已通过','green','B02 / G2'],['09-30','历史未知','yellow','执行与资金证据缺失']];
return [['10-19','已通过','green','R16 v2'],['10-20',isDaily()&&!s.reconFixed?'待关联证据':'已通过',isDaily()&&!s.reconFixed?'red':'green',isDaily()&&!s.reconFixed?'R17 v2':'R17 v3'],['10-21',s.scene==='waiting'?'等待执行回报':isDaily()&&!s.reconFixed?'等待前序核对':'已通过',s.scene==='waiting'||isDaily()&&!s.reconFixed?'yellow':'green',s.scene==='waiting'?'预计 10-22 到齐':isDaily()&&!s.reconFixed?'前序处理后自动追赶':'R18 v1']];
}
function renderMain(){
const h=health(),list=issues(),pendingReview=isDaily()&&!list.length&&!s.confirmed;
root.querySelector('#rc-port-status').textContent=h.state;
root.querySelector('#rc-port-status').className='rc-tag '+(h.good?'rc-green':h.count?'rc-red':'rc-yellow');
root.querySelector('#rc-scene').value=sceneValue();
const action=h.count?btn('处理首项 '+icon('arrow-right'),'open:'+list[0].id,'rc-primary'):pendingReview?btn('审核并确认恢复','open:status','rc-primary'):btn('查看核对记录','open:queue');
main.innerHTML=`<div class="rc-page-head"><div><div class="rc-title-line">${icon('compass')}<h2>检查与对账</h2></div><small class="rc-muted">处理影响运行的问题，核对每一次自动执行</small></div><div class="rc-page-tools">${link(icon('circle-help')+' 页面说明','open:help')}${link(icon('sparkles')+' AI 辅助','open:ai')}</div></div>
<section class="rc-status ${h.good?'rc-status-ok':''}" aria-label="当前交易结论"><div class="rc-status-main"><span class="rc-status-mark">${icon(h.mark)}</span><div><h1>${h.title}</h1><p class="rc-status-sub">${h.sub}</p></div></div><div class="rc-status-actions">${action}${link('运行状态审核 '+icon('chevron-right'),'open:status')}</div></section>
<div class="rc-capabilities">${s.scene==='error'?`<span>${icon('circle-help')} 新买入 / 自动恢复 / 风险退出：当前均未知</span>`:`<span>新买入 <b class="${h.good?'rc-green-text':'rc-red-text'}">${h.good?'允许':'暂停'}</b></span><span>自动恢复 <b>${h.good?'按既定规则':'待审核'}</b></span><span>风险退出 <b class="rc-green-text">允许</b></span>`}<span style="margin-left:auto">最近检查 10:32:08 ${link(icon('refresh-cw')+' 重新检查','recheck')}</span></div>
<div class="rc-section-head"><div class="rc-section-title">待处理事项 ${list.length?`<span class="rc-count">${list.length}</span>`:''}<small>按处理顺序排列</small></div>${link('每日核对记录 '+icon('chevron-right'),'open:queue')}</div>
${list.length?`<div class="rc-task-list">${list.map((x,i)=>`<article class="rc-task"><span class="rc-task-index">${i+1}</span><div><div class="rc-task-title">${x.title}${tag(x.type,i===0?'cyan':'neutral')}</div><p class="rc-task-meta">${x.meta}</p><p class="rc-task-finish">完成条件：${x.finish}</p></div>${btn(x.action+' '+icon('chevron-right'),'open:'+x.id,'rc-task-action')}</article>`).join('')}</div>`:`<div class="rc-empty">${icon(pendingReview?'user-round-check':s.scene==='history'?'clock-3':'circle-check')}<div><strong>${pendingReview?'3 项问题已处理，请完成最后一次审核':s.scene==='history'?'新基线已接续，自动作业将从 10-22 开始核对':'没有需要你处理的阻断项'}</strong><p>${pendingReview?'本次恢复只针对已核验范围，修复完成不会直接放行交易。':s.scene==='waiting'?'执行回报到齐后自动核对；超时或出现差异时，才会生成待办。':s.scene==='history'?'历史未知仍可在每日记录与审计记录中追溯。':'日常核对会自动运行；有实际差异时，再在这里处理。'}</p></div></div>`}
<div class="rc-automatic">${icon('workflow')}<div><strong>自动对账作业</strong> <span>· ${s.scene==='waiting'?'等待 10-21 执行回报':s.scene==='history'?(s.baselineAccepted?'新覆盖起点 10-22，等待首次核对':'停在 09-30，历史证据不足'):s.scene==='error'?'状态读取失败':isDaily()&&!s.reconFixed?'10-20 等待证据关联':'最近一批核对已完成'}</span><br><span>事件到达即触发 · 每 5 分钟补扫 · 下一次 10:35</span></div>${link('查看作业 '+icon('chevron-right'),'open:job')}</div>
<div class="rc-secondary"><span class="rc-secondary-label">验收与记录</span>${link(icon('git-compare-arrows')+' 双跑验收','open:dual')}${link(icon('history')+' 审计记录','open:audit')}${link(icon('sparkles')+' 解释当前阻断','open:ai')}</div>
<details class="rc-more"><summary class="cursor-interaction">其他提醒与信息 · 2 项，不影响当前下单权限</summary><p>${tag('提醒','yellow')} 无自动模式成员：候选池仍可继续维护，在持仓成员中设置自动模式。</p><p>${tag('信息','cyan')} 灰度准入条件未满足：仅影响新引擎链切换，可在双跑验收中查看。</p></details>`;
}
function drawerInfo(type){
if(s.scene==='error'&&!['help','ai','audit','error'].includes(type))return drawerInfo('error');
switch(type){
case'recon':return ['每日对账 · 10 月 20 日','核查执行记录，再重跑本日核对','执行证据 / '+(s.reconFixed?'R17 v3':'R17 v2'),reconBody(),s.reconFixed?['查看运行审核','open:status',false,'重检已通过，仍须核实其他阻断。']:s.found?['关联并重新核对','modal:recon',readOnly(),'范围仅 main · 2026-10-20，不发起新交易。']:['自动查找执行证据','recon-find',false,'查找决策、订单和撮合回报的关联关系。']];
case'data':return ['数据检查 · 000001','具体是哪项数据影响了评分？','平安银行 / 模型 A / 10-21',dataBody(),s.dataFixed?['查看下一项','next',false,'此项已清除，其他阻断仍单独校验。']:s.repair==='running'?['正在执行…','noop',true,'已保留已完成步骤，请等待本次结果。']:s.repair==='partial'?['重试失败步骤','data-retry',readOnly(),'只重试成交量指标与依赖评分。']:['预览修复计划','modal:data',readOnly(),'先确认对象、日期与影响，再执行修复。']];
case'binding':return ['策略绑定审核','已保存 ≠ 已验收 ≠ 已切换','当前使用 S17 / 待处理 S18',bindingBody(),s.bindingFixed?['查看运行审核','open:status',false,'继续使用已验收 S17，本次不切换引擎。']:['保留当前版本并消除歧义','modal:binding',readOnly(),'新版本可在双跑验收中单独准备。']];
case'status':return ['运行状态审核','为什么暂停，满足什么才能恢复？','组合 main / 检查快照 CK-1022-1032',statusBody(),['审核并确认恢复','modal:resume',readOnly()||issues().length>0||s.scene==='error'||s.scene==='history'||s.scene==='waiting'||s.scene==='healthy'||s.confirmed,issues().length?'先处理清单中的阻断，再确认当前报告。':'确认后仅释放本次通过的日常核对限制。']];
case'queue':return ['每日核对记录','逐日确认：计划、执行和资产是否一致','自动生成记录，异常才需要人工介入',queueBody(),['查看自动对账作业','open:job',false,'作业完成与业务核对通过是两种状态。']];
case'job':return ['自动对账作业','系统负责追赶日期，用户负责异常审核','独立后台作业 / 事件触发 + 定期补扫',jobBody(),['查看逐日核对结果','open:queue',false,'重试会复用同一日任务，避免重复核对和下单。']];
case'history':return ['历史证据未知','旧期无法核验时，给出明确的接续出口','09-30 / B02 · G2',historyBody(),s.baselineAccepted?['查看新覆盖范围','open:queue',false,'旧期状态保留为未知，审计链不断开。']:['审核新的覆盖起点','modal:baseline',readOnly()||s.cashUnknown,'必须先独立确认当前资金、持仓与未完成义务。']];
case'dual':return ['双跑验收','先选择旧 / 新引擎链，再查看有效差异','不占用日常运行阻断，切换单独审核',dualBody(),s.dualRan?['确认版本切换','noop',true,'当前仅 3 / 10 个有效日，尚不满足准入。']:['运行双跑','dual-run',s.dualUnavailable||readOnly(),'复用相同模型与输入；执行通过后仍不自动切换。']];
case'audit':return ['审计记录','从阻断到恢复，看清完整处理链','当前组合 main / 最近事件',auditBody(),['查看运行状态与当前证据','open:status',false,'只记录已经发生的操作和状态变化。']];
case'ai':return ['AI 辅助 · 当前检查上下文','把证据翻译成可执行的下一步','读取当前组合、报告与数据依赖',aiBody(),[s.scene==='error'?'重试读取检查':issues()[0]?.id==='history'?'查看历史接续条件':issues()[0]?.id==='recon'?'核查执行证据':issues()[0]?.id==='data'?'查看数据修复计划':issues()[0]?.id==='binding'?'审核策略绑定':'查看运行状态',s.scene==='error'?'recheck':issues().length?'open:'+issues()[0].id:'open:status',false,'AI 可准备限定修复计划，本人审核与交易权限由你确认。']];
case'help':return ['页面说明','这里帮你回答三件事','检查与对账',`${callout('现在能不能运行？','首屏展示当前结论与能力范围；运行状态审核能看到逐项依据。')}${subsection('有问题时，照着顺序处理')}<ol class="rc-steps"><li><span>1</span><div>从待办列表打开对应问题，在抽屉里核实原因与证据。</div></li><li><span>2</span><div>预览限定修复计划，在确认弹窗中提交。完成后系统重新校验。</div></li><li><span>3</span><div>全部日常阻断清除后，由本人审核当前报告并恢复。</div></li></ol>${subsection('每日对账在核对什么？')}<p class="rc-inline-note">核对计划是否正确执行、订单与撮合是否一致、资金与持仓是否对得上。缺少执行来源时先查证，不直接把“缺记录”当成资金差异。</p>${detail('引擎升级在哪里做？','<p>双跑验收比较旧、新引擎链。模型作为固定输入；验收通过后仍需要单独确认切换。</p>')}`,['开始处理首项','next',false,'提示与按钮会随真实检查结果变化。']];
default:return ['检查服务暂不可用','当前结果未知，无法给出运行结论','读取失败 / request CK-1022-1032',callout('检查服务请求超时','当前未获取到核对、数据与权限结果。未知结果不会显示为“0 个问题”或自动通过。','rc-danger')+facts([['最近成功读取','10:27:04'],['本次读取','10:32:08 · 超时'],['建议操作','先重新读取检查；持续失败时查看服务状态。']]),['重新读取检查','recheck',false,'原有已生效的限制由服务端保持。']];
}}
function reconBody(){

function aiBody(){
const noIssue=issues().length===0;
let content=s.scene==='error'?'<p>当前检查读取失败，我没有足够证据判断是数据、执行还是权限问题。建议先恢复检查读取。</p>':s.scene==='history'?'<p>这属于历史证据无法恢复。先独立核验当前资金、持仓与未完成义务；满足后审核新覆盖起点，旧期继续保留“未知”。</p>':noIssue?`<p>${isDaily()&&!s.confirmed?'已完成修复，可以核实当前报告后由本人确认恢复。':'当前没有待处理的日常阻断，我不会为正常状态生成无关修复任务。'}</p>`:!s.dataFixed&&(s.aiTopic==='data'||s.reconFixed)?'<p>根因是 000001 的 10-21 成交量指标缺失，阻断了模型 A 评分生成。可以准备限定修复：补齐输入 → 计算指标 → 重算评分 → 检查时效。</p>':s.reconFixed&&s.dataFixed?'<p>执行与数据已经通过，只剩策略绑定待审核。核实继续使用的已验收 S17，并明确 S18 暂不应用后，再进入本人恢复审核。</p>':'<p>当前建议从 <b>10-20 执行证据</b>开始。缺少的是核对记录的关联，不能据此判断钱或持仓已经不一致。</p><ul><li>先查找同日决策与真实模拟执行回报。</li><li>确认来源匹配后，关联证据并重跑本日核对。</li><li>再处理数据缺口和策略绑定，最后由本人审核恢复。</li></ul>';
return `<div class="rc-ai-question">${s.aiTopic==='data'&&!s.dataFixed?'评分为什么过期？该补什么？':'为什么卡住？我下一步该做什么？'}</div><div class="rc-ai-message">${content}</div>${facts([['已使用上下文','组合 main · 当前检查与核对快照'],['可执行范围','只读诊断；经你确认后提交限定数据修复'],['本人负责','确认证据、恢复审核、新基线与引擎切换']])}<div class="rc-ai-prompts">${isDaily()&&!s.dataFixed?btn('解释评分缺失','ai-data'):''}${btn('看恢复条件','open:status')}${btn('看审计来源','open:audit')}</div><p class="rc-inline-note">建议基于当前演示证据生成；进入处理抽屉后仍可逐项核验。</p>`;
}
function modalInfo(type){
switch(type){
case'data':return {title:'确认执行数据修复',sub:'限定对象 · 数据任务',rows:[['组合','main · 模拟'],['对象','000001 / 2026-10-21 / 模型 A'],['执行步骤','验证行情 → 补成交量指标 → 重算评分 → 重新检查'],['结果影响','仅清除本项数据阻断，其余条件继续独立校验']],ack:'我已核对标的、日期与修复范围。',button:'确认修复',action:'data-run'};
case'recon':return {title:'关联证据并重新核对',sub:'只修复关联 · 不创建交易',rows:[['交易日','2026-10-20'],['来源','DR-1020 → SIM-1020 · 2 笔执行回报'],['核验范围','计划与执行、资金与持仓差异'],['后续','通过后追赶后续日期，交易恢复仍需本人确认']],ack:'已核对执行来源与日期，同意关联并重跑。',button:'确认关联并重跑',action:'recon-run'};
case'binding':return {title:'确认保留已验收的 S17',sub:'消除绑定歧义 · 不切换引擎',rows:[['当前版本','AE-731 → S17 · 规则 → 模型 → 风控 v2.8'],['候选版本','S18 保留为待验收候选'],['本次变更','执行绑定明确指向已验收 S17'],['后续','切换 S18 需在双跑验收中单独完成']],ack:'我确认本次继续使用 S17，S18 暂不应用。',button:'确认当前绑定',action:'binding-run'};
case'resume':return {title:'本人确认恢复新买入',sub:'审核当前报告版本',rows:[['组合','main · 模拟'],['审核报告','10-20：R17 v3；10-21 追赶：R18 v1'],['已通过','执行与资产差异 0；数据有效；绑定 S17 明确'],['生效范围','释放本次日常核对限制；不切换引擎、不下单']],note:true,ack:'我已核对当前报告与证据，确认恢复本次范围。',button:'确认恢复新买入',action:'resume-run'};
case'baseline':return {title:'确认新的核对覆盖起点',sub:'保留旧期未知 · 独立核实当前资产',rows:[['新基线','B03 / G3 · 2026-10-22 起'],['资产来源','10-22 10:31 同一时点资金、持仓及义务快照'],['已确认','当前资金、3 个持仓与未完成义务核验一致'],['保留状态','09-30 继续历史未知；新游标尚无已核验日期']],note:true,ack:'我已核验当前资产，并接受新覆盖起点及旧期未知记录。',button:'建立新覆盖起点',action:'baseline-run'};
default:return null;
}}
function renderLayer(focus=false){
if(!drawer&&!modal){layer.hidden=true;main.inert=false;workspace.style.minHeight='625px';return;}
main.inert=true;layer.hidden=false;workspace.style.minHeight='625px';
if(modal){const m=modalInfo(modal);layer.dataset.kind='modal';layer.innerHTML=`<div class="rc-modal-wrap"><section class="rc-modal" role="dialog" aria-modal="true" aria-labelledby="rc-dialog-title"><div class="rc-drawer-head"><div><div class="rc-eyebrow">${m.sub}</div><h2 id="rc-dialog-title">${m.title}</h2></div><button class="rc-close cursor-interaction" type="button" data-action="close-modal" aria-label="关闭确认弹窗">${icon('x')}</button></div><div class="rc-modal-body">${facts(m.rows)}${m.note?`<label class="rc-input-label">审核理由 <textarea id="rc-note" placeholder="写明已核对的证据与本次判断，至少 10 个字" rows="3"></textarea></label>`:''}<label class="rc-check"><input id="rc-modal-ack" type="checkbox">${m.ack}</label>${readOnly()?'<p class="rc-disabled-note">当前仅查看权限，需由有权限的审核人提交。</p>':''}</div><div class="rc-drawer-foot">${btn('返回核实','close-modal')}${btn(m.button,m.action,'rc-primary',true)}</div></section></div>`;}
else{const [eye,title,sub,body,foot]=drawerInfo(drawer);layer.dataset.kind='drawer';layer.innerHTML=`<section class="rc-drawer" role="dialog" aria-modal="true" aria-labelledby="rc-dialog-title"><header class="rc-drawer-head"><div><div class="rc-eyebrow">${eye}</div><h2 id="rc-dialog-title">${title}</h2><small>${sub}</small></div><button class="rc-close cursor-interaction" type="button" data-action="close-drawer" aria-label="关闭处理抽屉">${icon('x')}</button></header><div class="rc-drawer-body">${body}${readOnly()?'<p class="rc-disabled-note">当前仅查看权限：证据可查看，写入与审核不可提交。</p>':''}</div><footer class="rc-drawer-foot"><small>${foot[3]}</small>${btn(foot[0],foot[1],'rc-primary',foot[2])}</footer></section>`;}
icons();fit();if(focus)layer.querySelector('button:not(:disabled)')?.focus({preventScroll:true});
}
function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:17,height:17}});}
function fit(){requestAnimationFrame(()=>{if(layer.hidden)return;const panel=layer.querySelector('.rc-drawer')||layer.querySelector('.rc-modal-wrap');if(panel)workspace.style.minHeight=Math.max(625,panel.scrollHeight+(modal?80:0))+'px';});}
function render(){renderMain();renderLayer();icons();}
function save(){try{window.openai?.setWidgetState?.({modelContent:{prototype:'drawer-v3',scene:s.scene,remaining:issues().length,drawer,modal,dataFixed:s.dataFixed,reconFixed:s.reconFixed,bindingFixed:s.bindingFixed,confirmed:s.confirmed,baselineAccepted:s.baselineAccepted},privateContent:{version:3,state:s}})?.catch(()=>{});}catch(e){}}
function announce(text){live.textContent=text;}
function event(title,text){s.events.push({title,text});if(s.events.length>8)s.events.shift();}
function open(type,trigger){drawer=type;modal=null;if(trigger)returnAction=trigger;renderLayer(true);save();}
function close(){drawer=null;modal=null;renderLayer();const trigger=root.querySelector(`[data-action="${returnAction}"]`)||main.querySelector('button');trigger?.focus({preventScroll:true});save();}
function showModal(type){if(readOnly())return;modalReturn=drawer;modal=type;renderLayer(true);save();}
function closeModal(){modal=null;drawer=modalReturn;renderLayer(true);save();}
function next(){const item=issues()[0];open(item?item.id:'status');}
function startRepair(retry=false){if(readOnly())return;modal=null;drawer='data';s.repair='running';render();announce('限定数据修复已提交。');clearTimeout(timer);timer=setTimeout(()=>{if(!isDaily())return;s.repair=retry?'complete':'partial';if(retry){s.dataFixed=true;event('评分输入修复通过','000001 / 10-21 / 模型 A · 只清除此项数据限制。');announce('评分修复完成，剩余 '+issues().length+' 项独立阻断。');}else{event('数据修复部分完成','行情已验证，成交量指标计算超时；已完成步骤保留。');announce('修复部分完成，可重试失败步骤。');}render();save();},850);save();}
root.addEventListener('click',e=>{
const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;
if(a.startsWith('open:')){open(a.slice(5),a);return;}if(a.startsWith('modal:')){if(a==='modal:resume'&&(issues().length||s.confirmed||!isDaily()))return;if(a==='modal:baseline'&&(s.cashUnknown||s.baselineAccepted))return;showModal(a.slice(6));return;}
switch(a){
case'close-drawer':close();return;case'close-modal':closeModal();return;case'next':next();return;
case'recon-find':s.found=true;event('已发现待关联执行证据','DR-1020 与 SIM-1020 匹配；尚未写入关联。');announce('已找到执行证据，请核对后确认关联。');break;
case'evidence-toggle':{const x=root.querySelector('#rc-order-source');x.hidden=!x.hidden;fit();return;}
case'data-run':startRepair();return;case'data-retry':startRepair(true);return;
case'recon-run':if(!s.found||readOnly())return;s.reconFixed=true;modal=null;drawer='recon';event('证据已关联，重检通过','R17 v3 · 10-20 差异为 0，后续 10-21 已自动追赶。');announce('本日核对已通过，尚余 '+issues().length+' 项独立阻断。');break;
case'binding-run':if(readOnly())return;s.bindingFixed=true;modal=null;drawer='binding';event('当前绑定已确认','继续使用 AE-731 / S17，S18 保留待验收，不切换引擎。');announce('运行绑定已明确，尚余 '+issues().length+' 项独立阻断。');break;
case'resume-run':if(readOnly()||issues().length||!isDaily())return;s.confirmed=true;event('本人确认恢复当前范围','审核 R17 v3，释放本次日常限制；未切换引擎。审核理由：'+root.querySelector('#rc-note').value.trim());modal=null;drawer='status';announce('本人审核完成，新买入条件已恢复。');break;
case'baseline-run':if(readOnly()||s.cashUnknown||s.scene!=='history')return;s.baselineAccepted=true;event('新的核对覆盖起点已建立','B03 / G3 · 覆盖从 10-22 开始，旧期 09-30 仍为历史未知。审核理由：'+root.querySelector('#rc-note').value.trim());modal=null;drawer='history';announce('新起点已建立，首日核对尚未完成。');break;
case'dual-run':if(s.dualUnavailable||readOnly())return;s.dualRan=true;event('双跑演示报告已生成','3 / 10 个有效交易日，1 项信号差异，未准入。');announce('报告生成，样本不足，切换保持不可用。');break;
case'dual-diff':s.dualView='diff';break;case'dual-summary':s.dualView='summary';break;case'ai-data':s.aiTopic='data';break;
case'recheck':if(s.scene==='error'){announce('演示：读取仍失败，当前能力保持未知。');}else announce('已重新检查，剩余 '+issues().length+' 项待处理。');return;
default:return;
}
render();save();
});
root.addEventListener('change',e=>{
if(e.target.id==='rc-scene'){changeScene(e.target.value);return;}
if(e.target.id==='rc-modal-ack'){validateModal();return;}
if(e.target.id==='rc-dual-chain'){s.dualUnavailable=e.target.value==='missing';s.dualRan=false;s.dualView='summary';renderLayer();save();}
});
root.addEventListener('input',e=>{if(e.target.id==='rc-note')validateModal();});
function validateModal(){if(!modal)return;const m=modalInfo(modal),ack=root.querySelector('#rc-modal-ack')?.checked,note=root.querySelector('#rc-note');const submit=root.querySelector(`[data-action="${m.action}"]`);if(submit)submit.disabled=!ack||readOnly()||(m.note&&(!note||note.value.trim().length<10));}
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!layer.hidden){e.preventDefault();modal?closeModal():close();return;}if(e.key==='Tab'&&!layer.hidden){const els=[...layer.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,select,summary')].filter(x=>x.getClientRects().length);const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
layer.addEventListener('click',e=>{if(e.target===layer){modal?closeModal():close();}});
function changeScene(value){clearTimeout(timer);s={...defaults(),scene:value==='history-cash'?'history':value,cashUnknown:value==='history-cash'};drawer=null;modal=null;live.textContent='';render();save();}
function restore(value){const p=value?.privateContent;if(p?.version===3&&sceneNames[p.state?.scene]){s={...defaults(),...p.state};if(s.repair==='running')s.repair='partial';drawer=null;modal=null;}}
restore(window.openai?.widgetState);render();
window.addEventListener('openai:set_globals',e=>{const incoming=e.detail?.globals?.widgetState;if(incoming?.privateContent?.version===3&&JSON.stringify(incoming.privateContent.state)!==JSON.stringify(s)){clearTimeout(timer);restore(incoming);render();}});
if(globalThis.ResizeObserver){new ResizeObserver(()=>fit()).observe(root);}
if(globalThis.Tweak){const design={scene:sceneValue()};const tweak=new Tweak({container:root,onChange:()=>changeScene(design.scene)});tweak.addSelect(design,'scene',{label:'演示业务场景',options:[...Object.entries(sceneNames).map(([value,label])=>({value,label})),{value:'history-cash',label:'历史未知 · 当前资金待核验'}]});if(tweak.supported)root.querySelector('#rc-scene-wrap').hidden=true;}
})();
</script>
