#pt-reconcile-lab .pt-chain>strong{display:block;font-size:15px;margin:8px 0;font-weight:600}
#pt-reconcile-lab .pt-chain p{margin:6px 0;color:var(--pt-muted);font-size:12px}
#pt-reconcile-lab .pt-chain select{width:100%;margin:8px 0}
#pt-reconcile-lab .pt-chain-arrow{color:var(--pt-dim);text-align:center}
#pt-reconcile-lab .pt-data-table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}
#pt-reconcile-lab .pt-data-table th{font-size:11px;color:var(--pt-muted);font-weight:500;padding:10px 9px;background:var(--pt-soft)}
#pt-reconcile-lab .pt-data-table td{padding:11px 9px;border-bottom:1px solid var(--pt-line);vertical-align:top}
#pt-reconcile-lab .pt-data-table th:first-child,#pt-reconcile-lab .pt-data-table td:first-child{padding-left:0}
#pt-reconcile-lab .pt-table-wrap{overflow-x:auto;max-width:100%}
#pt-reconcile-lab .pt-inline-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#pt-reconcile-lab .pt-timeline{margin-top:19px}
#pt-reconcile-lab .pt-timeline-row{display:grid;grid-template-columns:52px 18px 1fr;gap:10px;padding-bottom:23px}
#pt-reconcile-lab .pt-timeline-time{font-size:11px;color:var(--pt-dim);font-variant-numeric:tabular-nums}
#pt-reconcile-lab .pt-timeline-marker{position:relative;color:var(--pt-brand)}
#pt-reconcile-lab .pt-timeline-marker:after{content:"";position:absolute;top:15px;bottom:-15px;left:3px;width:1px;background:var(--pt-line)}
#pt-reconcile-lab .pt-timeline-row:last-child .pt-timeline-marker:after{display:none}
#pt-reconcile-lab .pt-timeline-title{font-size:13px;font-weight:500}
#pt-reconcile-lab .pt-timeline-row p{margin:5px 0;color:var(--pt-muted);font-size:12px}
#pt-reconcile-lab .pt-footnote{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap;color:var(--pt-dim);font-size:11px;padding-top:15px}
#pt-reconcile-lab .pt-footnote>span{display:flex;align-items:center;gap:5px}
#pt-reconcile-lab .pt-footnote svg{width:12px;height:12px}
#pt-reconcile-lab .pt-feedback{margin:9px 0 0;color:var(--pt-brand);font-size:12px;min-height:20px}
#pt-reconcile-lab .pt-empty{padding:36px 20px;text-align:center}
#pt-reconcile-lab .pt-empty-symbol{width:45px;height:45px;display:grid;place-items:center;background:var(--pt-brand-soft);color:var(--pt-brand);border-radius:50%;margin:0 auto 14px}
#pt-reconcile-lab .pt-empty p{font-size:12px;color:var(--pt-muted)}
#pt-reconcile-lab .pt-ai-intro{display:flex;gap:9px;align-items:center;margin-bottom:13px}
#pt-reconcile-lab .pt-ai-badge{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--pt-brand);background:var(--pt-brand-soft)}
#pt-reconcile-lab .pt-numbered{display:flex;gap:10px;margin:15px 0}
#pt-reconcile-lab .pt-step-number{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--pt-brand);background:var(--pt-brand-soft);flex-shrink:0}
#pt-reconcile-lab .pt-numbered strong{font-size:12px;font-weight:600}
#pt-reconcile-lab .pt-numbered p{font-size:11px;color:var(--pt-muted);margin:3px 0}
#pt-reconcile-lab .pt-queue-date{font-variant-numeric:tabular-nums}
@media(max-width:850px){#pt-reconcile-lab .pt-main{padding:20px 17px 13px}#pt-reconcile-lab .pt-shell{grid-template-columns:54px minmax(0,1fr)}#pt-reconcile-lab .pt-workspace{grid-template-columns:minmax(0,1fr)}#pt-reconcile-lab .pt-health{flex-wrap:wrap}#pt-reconcile-lab .pt-health-actions{width:100%;justify-content:flex-start;padding-left:50px}#pt-reconcile-lab .pt-breadcrumb{display:none}#pt-reconcile-lab .pt-rail{padding:18px 4px}#pt-reconcile-lab .pt-item{padding:13px 17px}#pt-reconcile-lab .pt-rail-foot{padding-top:35px}#pt-reconcile-lab .pt-list-footer{padding:10px 17px}}
@media(max-width:520px){#pt-reconcile-lab .pt-shell{display:block}#pt-reconcile-lab .pt-rail{display:none}#pt-reconcile-lab .pt-main{padding:17px 12px 12px}#pt-reconcile-lab .pt-topbar{padding:12px}#pt-reconcile-lab .pt-reviewbar{gap:7px}#pt-reconcile-lab .pt-demo{margin-left:0}#pt-reconcile-lab .pt-review-scene{width:100%}#pt-reconcile-lab .pt-page-heading{flex-wrap:wrap;gap:10px}#pt-reconcile-lab .pt-heading-actions{width:100%;justify-content:flex-start;margin-left:0}#pt-reconcile-lab h1{font-size:22px}#pt-reconcile-lab .pt-health{padding:14px 12px;gap:10px}#pt-reconcile-lab .pt-health-actions{padding-left:0}#pt-reconcile-lab .pt-health-title{font-size:15px}#pt-reconcile-lab .pt-tabs{gap:15px;flex-wrap:wrap}#pt-reconcile-lab .pt-record-link{margin-left:0;padding-bottom:10px}#pt-reconcile-lab .pt-chain-grid{grid-template-columns:minmax(0,1fr)}#pt-reconcile-lab .pt-chain-arrow{transform:rotate(90deg)}#pt-reconcile-lab .pt-inline-columns{grid-template-columns:minmax(0,1fr)}#pt-reconcile-lab .pt-record-surface{padding:15px}#pt-reconcile-lab .pt-panel-body{padding:15px}#pt-reconcile-lab .pt-kv{grid-template-columns:78px minmax(0,1fr)}#pt-reconcile-lab .pt-job-divider{display:none}#pt-reconcile-lab .pt-health-icon{width:29px;height:29px}#pt-reconcile-lab .pt-health-text{flex-basis:calc(100% - 40px)}}
@media(pointer:coarse){#pt-reconcile-lab button,#pt-reconcile-lab select{min-height:44px}#pt-reconcile-lab textarea,#pt-reconcile-lab select{font-size:16px}}
@media(prefers-reduced-motion:reduce){#pt-reconcile-lab *{transition:none!important}}
</style>
<script>
(() => {
  const root = document.getElementById('pt-reconcile-lab');
  const scenes = ['blocked','history','job','unavailable','healthy','error','permission'];
  const initial = {scene:'blocked',view:'todo',selected:'recon',panel:'detail',record:'dual',dataFixed:false,dataPhase:'idle',reconFixed:false,reconInspected:false,confirmed:false,baselineStep:'inspect',baselineAccepted:false,baselineBlocked:false,dualCandidate:'unified',dualStage:'precheck',dualDay:'10-20',note:'',ack:false,jobRetried:false,version:17,theme:'auto',audit:[]};
  const saved = globalThis.openai?.widgetState?.modelContent;
  let restored = {};
  if(saved && scenes.includes(saved.scene)){
    restored.scene=saved.scene;
    for(const key of ['dataFixed','reconFixed','confirmed','baselineAccepted'])if(typeof saved[key]==='boolean')restored[key]=saved[key];
    if(['todo','records'].includes(saved.view))restored.view=saved.view;
    if(['recon','data','status','queue','history','job','error','dual','evidence'].includes(saved.selected)&&saved.selected!=='evidence')restored.selected=saved.selected;
  }
  let state = {...initial,...restored};
  const ui = {scene:state.scene,theme:'auto'};
  let epoch = 0;
  const icons = () => { if (globalThis.lucide?.createIcons) globalThis.lucide.createIcons({attrs:{width:16,height:16}}); };
  const ic = name => '<i data-lucide="'+name+'" aria-hidden="true"></i>';
  const escape = text => String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const tag = (text,tone='') => '<span class="pt-tag '+(tone?'pt-tag-'+tone:'')+'">'+text+'</span>';
  const button = (text,action,primary=false,icon='',disabled=false) => '<button class="pt-button '+(primary?'pt-button-primary':'')+' cursor-interaction" data-action="'+action+'" '+(disabled?'disabled':'')+'>'+(icon?ic(icon):'')+text+'</button>';
  const link = (text,action,icon='') => '<button class="pt-text-button cursor-interaction" data-action="'+action+'">'+(icon?ic(icon):'')+text+'</button>';
  const callout = (text,tone='') => '<div class="pt-callout '+(tone?'pt-callout-'+tone:'')+'">'+text+'</div>';
  const isRestricted = () => state.scene==='permission';
  const healthy = () => state.scene==='healthy'||state.confirmed;
  const coverage = () => state.scene==='history' ? (state.baselineAccepted?{id:'B03',generation:'G3',start:'2026-10-22',through:'尚未核验任何新日期'}:{id:'B02',generation:'G2',start:'2026-09-29',through:'2026-09-29'}) : {id:'B02',generation:'G2',start:'2026-10-19',through:state.scene==='job'?'2026-10-20':(healthy()||state.reconFixed)?'2026-10-21':'2026-10-19'};
  const dates = () => {
    if(state.scene==='error')return [{day:'10-20',status:'读取失败',detail:'当前无法读取核验记录，保留已有门禁。',tone:'danger'}];
    if(state.scene==='job')return [{day:'10-19',status:'已通过',detail:'核验完成。',tone:'good'},{day:'10-20',status:'已通过',detail:'前序核验完成。',tone:'good'},{day:'10-21',status:'等待撮合',detail:'10-22 执行中，尚未超过结算截止。',tone:'warn'}];
    const closed=healthy()||state.reconFixed;
    return [{day:'10-19',status:'已通过',detail:'执行、持仓、资金证据完整。',tone:'good'},{day:'10-20',status:closed?'已通过':'缺执行证据',detail:closed?'报告 R17 v3 已核验通过。':'当前最早缺口，需先核查已有执行记录。',tone:closed?'good':'warn'},{day:'10-21',status:closed?'已通过':'等待前序',detail:closed?'后续核验已完成，连续边界已更新。':'等待 10-20 处理，不跳过前序。',tone:closed?'good':'warn'}];
  };
  const pendingDays = () => state.scene==='history'?1:dates().filter(x=>x.status!=='已通过').length;
  const blockers = () => state.scene==='error'?null:healthy()?0:state.scene==='history'?(state.baselineAccepted?0:1):state.scene==='job'?0:(state.dataFixed?0:1)+(state.reconFixed?0:1);
  const footer = (actions,note='') => '<div class="pt-panel-footer"><div class="pt-action-row">'+actions+'</div>'+(note?'<p>'+note+'</p>':'')+'</div>';
  const heading = (eyebrow,title,sub) => '<div class="pt-eyebrow">'+eyebrow+'</div><h2>'+title+'</h2><p class="pt-subtitle">'+sub+'</p>';
  const kv = values => '<dl class="pt-kv">'+values.map(([a,b])=>'<dt>'+a+'</dt><dd>'+b+'</dd>').join('')+'</dl>';
  const check = (title,status,description,tone='good',action='') => '<div class="pt-check"><span class="pt-check-icon '+(tone==='danger'?'pt-negative':tone==='warn'?'pt-warning':'')+'">'+ic(tone==='good'?'circle-check':tone==='danger'?'circle-alert':'clock-3')+'</span><div class="pt-check-main"><div class="pt-check-title"><span>'+title+'</span>'+tag(status,tone)+'</div><p>'+description+'</p>'+(action?link('查看依据',action):'')+'</div></div>';
  const store = () => { try {globalThis.openai?.setWidgetState({modelContent:{scene:state.scene,view:state.view,selected:state.selected,dataFixed:state.dataFixed,reconFixed:state.reconFixed,confirmed:state.confirmed,baselineAccepted:state.baselineAccepted},privateContent:{theme:ui.theme}})?.catch(()=>{});}catch{} };
  function feedback(text){root.querySelector('#pt-feedback').textContent=text;}
  function audit(title,detail){state.audit.unshift({time:'10:33',title,detail});}
  function setScene(scene){
    epoch++;
    state={...initial,scene,audit:[]};
    if(scene==='history')state.selected='history';
    if(scene==='job')state.selected='job';
    if(scene==='unavailable'){state.view='records';state.selected='dual';state.dualCandidate='unavailable';}
    if(scene==='healthy'){state.selected='status';state.dataFixed=true;state.reconFixed=true;}
    if(scene==='error')state.selected='error';
    ui.scene=scene;
    render();store();feedback('已切换评审场景：所有状态、证据与权限同时更新。');
  }
  function healthHTML(){
    const n=blockers();
    let title,sub,tone='',icon='pause',buys='已暂停',recovery='待本人审核';
    if(state.scene==='error'){title='暂时无法判断运行状态';sub='核对服务读取失败。最近一次结果仅供参考，请先恢复检查。';tone='error';icon='circle-alert';buys='无法判定';recovery='无法判定';}
    else if(healthy()){title='日常运行条件已满足';sub='当前核验范围内无未解决阻断，自动接管将按计划执行。';tone='good';icon='shield-check';buys='门禁允许';recovery='无需审核';}
    else if(state.scene==='history'){title=state.baselineAccepted?'新账户基线已接受，等待首日核验':'历史证据缺失，需要确认核验起点';sub=state.baselineAccepted?'新覆盖范围从 10-22 开始，旧期仍保留未知；尚未核验任何新日期。':'09-30 的必要材料无法恢复。先核验当前账户，再申请新的覆盖范围。';icon='history';buys=state.baselineAccepted?'待首日核验':'已暂停';recovery='待核验';}
    else if(state.scene==='job'){title='执行结果尚未到齐，正在等待撮合';sub='10-21 决策预计在 10-22 执行，暂未超过结算截止；系统将自动继续核对。';icon='clock-3';buys='执行中';recovery='无需处理';}
    else if(n===0){title='修复已完成，等待本人确认恢复';sub='对账与评分检查已通过。请核对修复材料后解除异常暂停。';icon='clipboard-check';buys='待审核';}
    else {title='新买入已暂停 · '+n+' 项待处理';sub=(state.reconFixed?'对账缺口已解决':'10-20 对账缺执行证据')+'；'+(state.dataFixed?'评分数据已修复':'000001 评分缺少指标输入')+'。';}
    const capTone=healthy()?'pt-positive':state.scene==='error'?'pt-muted':'pt-warning';
    return '<div class="pt-health '+(tone?'pt-health-'+tone:'')+'"><div class="pt-health-icon">'+ic(icon)+'</div><div class="pt-health-text"><div class="pt-health-title">'+title+'</div><p>'+sub+(isRestricted()?' 当前账号只读，可查看证据，不能提交修复或本人确认。':'')+'</p><div class="pt-capabilities"><span class="'+capTone+'"><b class="pt-dot"></b>新买入 '+buys+'</span><span class="'+(state.scene==='error'?'pt-muted':'pt-positive')+'"><b class="pt-dot"></b>风险退出 '+(state.scene==='error'?'按独立门禁判断':'门禁允许')+'</span><span class="pt-muted"><b class="pt-dot"></b>自动恢复 '+recovery+'</span></div></div><div class="pt-health-actions">'+button('重新检查','recheck',false,'refresh-cw')+button('AI 辅助处理','ai',true,'sparkles')+'</div></div>';
  }
  function jobbarHTML(){
    const wait=state.scene==='job',fail=state.scene==='error';
    return '<div class="pt-jobbar">'+ic(fail?'circle-alert':wait?'clock-3':'circle-check')+'<b class="'+(fail?'pt-negative':'pt-positive')+'">自动核对 · '+(fail?'读取异常':wait?'等待撮合':'运行正常')+'</b><span class="pt-job-divider"></span><span>上次 10:30</span><span>下次 10:35</span><span class="pt-job-divider"></span><span>'+(fail?'待核对数量未知':state.baselineAccepted?'首日待核验':pendingDays()+' 日待核对')+'</span>'+link('查看作业','select:job','arrow-up-right')+'</div>';
  }
  function item(id,title,status,desc,evidence,action,tone='danger'){
    return '<button class="pt-item cursor-interaction '+(state.selected===id?'pt-item-selected':'')+'" data-action="select:'+id+'" aria-pressed="'+(state.selected===id)+'"><div class="pt-item-heading"><div class="pt-item-title">'+title+'</div>'+tag(status,tone)+'</div><p>'+desc+'</p><div class="pt-item-evidence">'+evidence.map(x=>'<span>'+x+'</span>').join('')+'</div><div class="pt-item-action">'+action+ic('arrow-right')+'</div></button>';
  }
  function listHTML(){
    let rows='';
    if(state.scene==='error')rows='<div class="pt-empty"><div class="pt-empty-symbol">'+ic('unplug')+'</div><h2>检查结果读取失败</h2><p>保留原有门禁，不把未知当作通过。</p>'+button('重试检查','recheck',false,'refresh-cw')+'</div>';
    else if(healthy())rows='<div class="pt-empty"><div class="pt-empty-symbol">'+ic('check')+'</div><h2>当前没有阻断事项</h2><p>最近核验日期：10-21<br>自动核对仍会持续检查账户活动。</p>'+button('查看每日核对记录','select:queue',false,'calendar-check-2')+'</div>';
    else if(state.scene==='history')rows=item('history','09-30 历史证据无法恢复',state.baselineAccepted?'旧期保留未知':'覆盖待确认','历史执行配置与持仓快照缺失，不能声明当日账实相符。',['当前账户可核验','旧期不填零'],state.baselineAccepted?'查看新覆盖范围':'核查并申请账户基线','warn')+item('queue','核对覆盖范围','独立记录','新起点与已完成日期分别记录，不将旧期缺口隐藏。',['代次 '+(state.baselineAccepted?'G3':'G2'),'历史缺口 1 段'],'查看覆盖与游标','blue');
    else if(state.scene==='job')rows=item('job','10-21 正在等待成交回报','正常等待','未超过核对截止时点，系统不会提前判缺单。',['预计 10-22 执行','下次检查 10:35'],'查看作业与执行条件','blue')+item('queue','每日核对队列','1 日待核验','前序 10-19、10-20 均已通过，10-21 正常等待撮合。',['已核验至 10-20'],'查看日期队列','blue');
    else{
      if(!state.reconFixed)rows+=item('recon','10-20 对账缺执行证据','阻断新买入','当日应执行，但未找到成功的自动模拟记录。',['订单 0 · 已查','现金与持仓已核验'],'核查并处理');
      if(!state.dataFixed)rows+=item('data','000001 评分数据有缺口','阻断新买入','成交量指标输入缺失，评分不能用于当前模型。',['1 / 3 标的异常','模型 A · 应到 10-21'],'修复数据缺口');
      if(state.reconFixed&&state.dataFixed)rows+=item('status','修复完成，待本人确认','待审核','原阻断项均已修复，本人审核后才能解除异常暂停。',['最新报告 R17 v3','材料 4 / 4 齐全'],'运行状态审核','warn');
      if(state.reconFixed||state.dataFixed)rows+='<div class="pt-group-label">'+ic('circle-check')+'本次已解决 '+((state.reconFixed?1:0)+(state.dataFixed?1:0))+' 项</div>'+item('audit','查看本次修复经过','已留痕','已完成动作与重检结果可追溯。',['仅解除已解决条件'],'查看修复记录','good');
      rows+='<div class="pt-group-label">方案切换准入 · 不计入日常买入阻断</div>'+item('dual','统一决策链尚未完成验收','准入待办','用于切换新方案，不是每天必须完成的核对。',['当前方案保持不变'],'准备版本切换验收','blue');
    }
    const c=coverage();
    return '<section class="pt-list"><div class="pt-list-head"><h2>需要处理的事项</h2><span class="pt-small">'+(blockers()===null?'状态未知':blockers()+' 项阻断')+'</span>'+link('查看记录','records:audit')+'</div>'+rows+'<div class="pt-list-footer">核验范围：'+c.start.slice(5)+' 起 · 账户基线 '+c.id+' · '+c.generation+'<br>'+link('查看日期队列与基线来源','select:queue','calendar-range')+'</div></section>';
  }
  function reconHTML(){
    const ready=state.reconInspected;
    return heading('每日对账 / 10-20',state.reconFixed?'执行证据已关联，该日核验通过':ready?'已找到真实记录，待关联并核对':'缺少自动模拟记录，尚未完成核对',state.reconFixed?'已关联原始运行，账户核验通过；是否恢复仍按独立门禁判断。':'核对计划、实际执行、资金与持仓是否一致。本次问题属于执行证据缺口。')+
      callout('<b>当时应执行：</b>接管与调度均已启用，计划 20:30 运行，已超过执行窗口。','warn')+
      '<h3>已核验的事实</h3>'+check('执行链',state.reconFixed?'已关联并通过':ready?'已找到，待关联':'缺运行关联',ready?'找到真实运行 DR-1020，组合、日期、来源一致。':'未找到成功记录；没有用“无记录”推断为正常无活动。',state.reconFixed?'good':'warn','evidence:execution')+
      check('订单与成交','已查，无活动','订单 0，成交 0；已完整查询，非读取失败。','good','evidence:orders')+
      check('现金与持仓','账实一致','现金差额 0；3 个持仓数量及成本与对应快照一致。','good','evidence:account')+
      '<h3>完成条件</h3><p class="pt-subtitle">'+(ready?'关联已有真实运行后重新核对。不会补写交易，也不会重新下单。':'先查找已有执行与调度记录；如历史确实未执行，按独立处置流程审核。')+'</p>'+

    const name=names[state.evidence]||'证据来源';
    return heading('原始依据',name,'证据可定位到具体对象、日期与查询结果，技术信息默认收起。')+
      kv([['归属组合','稳健成长组合 / 模拟账户'],['业务日期',state.evidenceDate||'2026-10-21'],['检查时点','2026-10-22 10:32'],['来源状态',state.evidence==='ledger-gap'?'待补充原始资金凭据':'读取完成'],['可用性',state.evidence==='indicator'?'当日依赖项缺失，其余来源正常':'来源与记录指纹已固定']])+
      callout(state.evidence==='execution'?(state.reconInspected?'真实运行 DR-1020 与组合/日期匹配，可关联后重新核对。':'当日应执行计划存在，执行关联尚缺。应先查询已有运行，不重跑历史交易。'):state.evidence==='ledger-gap'?'先从原始现金流水、导入记录或可信备份恢复来源。当前不能申请新基线。':'展示实际查询结果，成功查到 0 与读取失败严格区分。')+
      '<details><summary>技术信息与追溯编号</summary>'+kv([['证据 ID','EV-1022-'+escape(state.evidence||'snapshot')],['源版本','固定于当前快照 V'+state.version],['接受审计','AE-731 / 本人确认记录']])+'</details>'+
      footer(button('返回处理事项','evidence-back',false,'arrow-left'));
  }
  function detailHTML(){
    if(state.panel==='ai')return aiHTML();
    if(state.selected==='recon')return reconHTML();
    if(state.selected==='data')return dataHTML();
    if(state.selected==='plan')return dataHTML(true);
    if(state.selected==='status')return statusHTML();
    if(state.selected==='queue')return queueHTML();
    if(state.selected==='history')return historyHTML();
    if(state.selected==='job')return jobHTML();
    if(state.selected==='evidence')return evidenceHTML();
    if(state.selected==='error')return heading('检查服务','当前证据读取失败','读取失败不会展示为“订单 0”或“全部通过”。')+callout('核对服务暂不可用；保留现有门禁，恢复服务后可重检。','danger')+footer(button('重试读取检查','recover',true,'refresh-cw'),'原型中可演示重试恢复，不连接实际服务。');
    return heading('版本切换验收','当前方案保持运行','双跑只用于本次新链切换或扩大范围，不能当作每天的签字任务。')+footer(button('查看验收预检','records:dual',true,'git-compare-arrows'));
  }
  function panelHTML(){
    return '<section class="pt-panel" aria-label="事项处理面板"><div class="pt-panel-tabs"><button class="pt-panel-tab '+(state.panel==='detail'?'pt-panel-tab-active':'')+'" data-action="panel:detail">处理详情</button><button class="pt-panel-tab '+(state.panel==='ai'?'pt-panel-tab-active':'')+'" data-action="panel:ai">'+ic('sparkles')+' AI 建议</button>'+tag('当前证据 V'+state.version)+'</div><div class="pt-panel-body">'+detailHTML()+'</div></section>';
  }
  function dualHTML(){
    const unavailable=state.dualCandidate==='unavailable',result=state.dualStage==='result';
    let html='<div class="pt-section-heading"><div><div class="pt-eyebrow">方案切换 / 隔离比较</div><h2>旧链与候选新链，对同一输入验收</h2><p class="pt-subtitle">引擎链是验收对象；模型、策略和数据分别固定。通过后仍须本人审核切换。</p></div>'+tag(result?'演示报告 · 不可准入':unavailable?'环境能力未接通':'预检待完成',result?'blue':'warn')+'</div>';
    html+='<div class="pt-chain-grid"><div class="pt-chain">'+tag('当前已接受方案','good')+'<strong>旧来源决策链</strong><p>执行器 legacy · 构建 2026.10.16</p><p>独立模型：模型 A / 因子集 F18</p><p>策略快照 S17 · 本人接受于 10-19</p>'+link('查看基线接受来源','baseline-source','shield-check')+'</div><div class="pt-chain-arrow">'+ic('arrow-right')+'</div><div class="pt-chain">'+tag('待验收方案','blue')+'<label class="pt-input-label" for="pt-candidate">选择真实配置来源</label><select id="pt-candidate"><option value="unified" '+(!unavailable?'selected':'')+'>统一决策链 · 候选快照 C21</option><option value="unavailable" '+(unavailable?'selected':'')+'>当前环境未接入真实执行器</option></select><p>独立模型：模型 A / 因子集 F18</p><p>候选未激活，不影响当前方案</p></div></div>';
    if(state.dualStage==='source')html+=callout('<b>基线取数：</b>本人接受事件 AE-731 → 已接受绑定 S17 → 冻结策略/成员/时钟 → 执行器构建清单。最新保存版本与全局活动模型不自动覆盖此基线。','good');
    if(unavailable)html+=callout('<b>当前环境没有真实执行器，无法启动真实验收。</b><br>不能靠填写引擎名称或虚拟空样本报告放行；可查看缺少的执行能力。','warn');
    if(result){
      html+='<h3>逐日结果 · 仅用于交互演示</h3><p class="pt-subtitle">示例日为 10-19、10-20、10-21，只有 3 个有效交易日，未满足至少 10 日要求。不能用于准入。</p><div class="pt-table-wrap"><table class="pt-data-table"><thead><tr><th>日期</th><th>有效标的</th><th>动作一致</th><th>需解释差异</th><th></th></tr></thead><tbody><tr><td>10-19</td><td>12</td><td>12 / 12</td><td>0</td><td>'+link('查看','dual-day:10-19')+'</td></tr><tr><td>10-20</td><td>12</td><td>11 / 12</td><td>1</td><td>'+link('查看','dual-day:10-20')+'</td></tr><tr><td>10-21</td><td>12</td><td>12 / 12</td><td>0</td><td>'+link('查看','dual-day:10-21')+'</td></tr></tbody></table></div><h3>'+state.dualDay+' · 标的差异</h3>'+callout(state.dualDay==='10-20'?'<b>000001：</b>基线 HOLD → 候选 NO_ACTION。候选覆盖阈值未满足，保留原因等待审核。其余 11 个动作一致。':'本日 12 个标的动作一致，有实际样本；仍不足以证明整个区间已通过。')+
      footer(button('证据不足，暂不能切换','none',true,'lock-keyhole',true)+link('返回预检','dual-precheck'),'演示来源永不产生可准入结论。真实报告缺失或解析失败也不能补造通过。');
    }else{
      html+='<h3>验收预检</h3>'+check('验收区间 / 最低样本','尚不足','示例覆盖 10-19 至 10-21，仅 3 日；需至少 10 个有效交易日。','warn')+check('同源输入与期初账户','已固定','双方使用账户基线 B02、同一标的范围和数据截止时点。','good')+check('真实执行器',unavailable?'未接通':'演示占位',unavailable?'能力发现未返回可调用执行器，不能启动。':'此为设计评审环境，执行器信息仅演示，不产生真实验收证据。','warn')+check('数据覆盖','候选有缺口','000001 的 10-21 评分缺指标输入，可从具体事项修复。','warn','select:data');
      html+=footer(button('开始真实验收','none',true,'play',true)+button('查看演示报告结构','dual-result',false,'file-chart-column'),unavailable?'未连接真实执行器；不提供无效启动或手填版本入口。':'尚缺真实执行器、完整区间和评分覆盖；当前仅可查看演示结构。');
    }
    return html;
  }
  function auditHTML(){
    const events=state.audit.concat([{time:'10:32',title:'检测到对账与评分缺口',detail:'10-20 无成功运行关联；000001 缺 10-21 指标输入。只读检测，未修改交易账户。'},{time:'10:30',title:'自动核对作业完成',detail:'核验任务 RC-1030 完成；业务结论：10-20 证据未齐，等待人工处理。'},{time:'10-19',title:'本人接受组合执行方案',detail:'接受审计 AE-731 → 绑定 S17。模型 A、因子集 F18、策略时钟和执行范围已固定。'}]);
    return heading('问题追溯','从发现原因，到修复与本人确认','时间线同时保留发生时间、归属交易日、证据来源和操作结果。')+'<div class="pt-timeline">'+events.map(e=>'<div class="pt-timeline-row"><span class="pt-timeline-time">'+e.time+'</span><span class="pt-timeline-marker"><span class="pt-dot"></span></span><div><div class="pt-timeline-title">'+escape(e.title)+'</div><p>'+escape(e.detail)+'</p>'+tag('本组合 · 演示记录')+'</div></div>').join('')+'</div>'+footer(link('返回待处理事项','view:todo','arrow-left'));
  }
  function recordsHTML(){
    return '<div class="pt-records"><div class="pt-record-tabs" aria-label="验收与记录内容"><button class="pt-record-tab" data-action="records:dual" aria-selected="'+(state.record==='dual')+'">版本切换验收</button><button class="pt-record-tab" data-action="records:audit" aria-selected="'+(state.record==='audit')+'">审计时间线</button></div><section class="pt-record-surface">'+(state.record==='dual'?dualHTML():auditHTML())+'</section></div>';
  }
  function render(){
    root.style.colorScheme=ui.theme==='auto'?'light dark':ui.theme;
    root.querySelector('#pt-health').innerHTML=healthHTML();
    root.querySelector('#pt-jobbar').innerHTML=jobbarHTML();
    root.querySelector('#pt-content').innerHTML=state.view==='todo'?'<div class="pt-workspace">'+listHTML()+panelHTML()+'</div>':recordsHTML();
    root.querySelector('#pt-tab-todo').classList.toggle('pt-tab-active',state.view==='todo');
    root.querySelector('#pt-tab-records').classList.toggle('pt-tab-active',state.view==='records');
    root.querySelector('#pt-tab-todo').setAttribute('aria-selected',String(state.view==='todo'));
    root.querySelector('#pt-tab-records').setAttribute('aria-selected',String(state.view==='records'));
    root.querySelector('#pt-content').setAttribute('aria-labelledby','pt-tab-'+(state.view==='todo'?'todo':'records'));
    root.querySelector('#pt-tab-count').textContent=blockers()===null?'?':String(blockers());
    root.querySelector('#pt-snapshot').textContent='V'+state.version;
    root.querySelector('#pt-scene-select').value=state.scene;
    root.querySelector('.pt-user span:last-child').textContent=isRestricted()?'只读访客':'本人';
    root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));
    icons();
  }
  function select(id){state.view='todo';state.panel='detail';state.selected=id==='audit'?'status':id;if(id==='audit'){state.view='records';state.record='audit';}render();}
  function advanceData(retry=false){
    if(isRestricted())return;
    state.dataPhase='running';state.selected='data';state.panel='detail';state.view='todo';
    const thisEpoch=epoch;render();feedback(retry?'仅重试失败的指标与评分步骤。':'修复任务已提交，正在处理限定范围。');
    setTimeout(()=>{if(epoch!==thisEpoch)return;if(!retry){state.dataPhase='partial';audit('数据修复部分完成','日 K 输入已核实，指标任务超时；评分尚未开始，可仅重试失败步骤。');feedback('部分完成：请重试失败部分，已成功步骤不会重复执行。');}else{state.dataPhase='done';state.dataFixed=true;state.version++;audit('评分缺口已修复并重检','000001 / 10-21 / 模型 A 数据已恢复；对账等独立门禁不受影响。');feedback('数据项已解决；'+(state.reconFixed?'请本人核验恢复材料。':'仍需处理对账证据。'));}render();store();},1000);
  }
  root.addEventListener('click',event=>{
    const el=event.target.closest('[data-action]');
    if(!el||el.disabled)return;
    const [action,arg]=el.dataset.action.split(':');
    if(action==='select')select(arg);
    else if(action==='view'){state.view=arg;render();}
    else if(action==='records'){state.view='records';state.record=arg;render();}
    else if(action==='panel'){state.panel=arg;render();}
    else if(action==='ai'){state.view='todo';state.panel='ai';render();}
    else if(action==='recheck'){state.version++;render();feedback('已按当前证据重检；仍缺少的事项保留，不因点击消失。');}
    else if(action==='recover'){setScene('blocked');feedback('演示读取已恢复：现有 2 项阻断，未自动放行。');}
    else if(action==='recon-inspect'){state.reconInspected=true;state.version++;audit('执行证据核查完成','找到真实运行 DR-1020，待核验组合/日期/来源并关联；未重跑交易。');render();feedback('已定位已有真实运行，可关联后重新核对。');}
    else if(action==='recon-resolve'&&!isRestricted()){state.reconFixed=true;state.version++;audit('对账执行关联已补齐','关联真实运行 DR-1020，报告 R17 v3 核验通过；仍需独立审核恢复。');render();feedback('对账项已解决；'+(state.dataFixed?'修复材料已齐，待本人审核。':'仍有评分缺口。'));}
    else if(action==='data-plan'){state.selected='plan';state.view='todo';state.panel='detail';render();}
    else if(action==='data-run')advanceData();
    else if(action==='data-retry')advanceData(true);
    else if(action==='confirm'&&!isRestricted()&&state.ack&&state.note.trim().length>=10&&state.reconFixed&&state.dataFixed){state.confirmed=true;state.version++;audit('本人确认恢复日常运行',state.note+'；基于 R17 v3，异常暂停已解除；模型与方案没有切换。');render();feedback('本人审核已完成，当前日常运行门禁通过。');}
    else if(action==='baseline-plan'){state.baselineStep='plan';state.note='';state.ack=false;render();}
    else if(action==='baseline-block-toggle'){state.baselineBlocked=!state.baselineBlocked;render();}
    else if(action==='baseline-accept'&&!state.baselineBlocked&&!isRestricted()&&state.ack&&state.note.trim().length>=10){state.baselineAccepted=true;state.version++;audit('本人接受新账户基线 B03','覆盖自 10-22 / G3 开始，旧期 09-30 仍未知；未核验任何新日期。');render();feedback('新基线已接受；旧期未知保留，新代核验日期为空。');}
    else if(action==='job-retry'){state.jobRetried=true;audit('提交限定范围重检任务','RC-1033 已排队；不触发交易、不确认恢复。');render();feedback('重检需求已持久化，任务 RC-1033 等待执行。');}
    else if(action==='evidence'){state.previous=state.selected;state.evidence=arg;state.evidenceDate=['execution','orders','account'].includes(arg)?'2026-10-20':['ledger-gap','baseline'].includes(arg)?'2026-10-22':'2026-10-21';state.selected='evidence';state.panel='detail';state.view='todo';render();}
    else if(action==='evidence-back'){state.selected=state.previous||'recon';render();}
    else if(action==='baseline-source'){state.dualStage=state.dualStage==='source'?'precheck':'source';render();}
    else if(action==='dual-result'){state.dualStage='result';render();}
    else if(action==='dual-precheck'){state.dualStage='precheck';render();}
    else if(action==='dual-day'){state.dualDay=arg;render();}
    store();
  });
  root.addEventListener('input',event=>{
    if(event.target.id==='pt-review-note'||event.target.id==='pt-baseline-note'){state.note=event.target.value;const b=root.querySelector('[data-action="'+(event.target.id==='pt-review-note'?'confirm':'baseline-accept')+'"]');if(b)b.disabled=!state.ack||state.note.trim().length<10||isRestricted()||(event.target.id==='pt-review-note'&&(!state.reconFixed||!state.dataFixed))||state.baselineBlocked;}
  });
  root.addEventListener('change',event=>{
    if(event.target.id==='pt-scene-select')setScene(event.target.value);
    else if(event.target.id==='pt-review-ack'||event.target.id==='pt-baseline-ack'){state.ack=event.target.checked;const b=root.querySelector('[data-action="'+(event.target.id==='pt-review-ack'?'confirm':'baseline-accept')+'"]');if(b)b.disabled=!state.ack||state.note.trim().length<10||isRestricted()||(event.target.id==='pt-review-ack'&&(!state.reconFixed||!state.dataFixed))||state.baselineBlocked;}
    else if(event.target.id==='pt-candidate'){state.dualCandidate=event.target.value;state.dualStage='precheck';render();store();}
  });
  globalThis.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.modelContent;if(saved&&scenes.includes(saved.scene)&&saved.scene!==state.scene)setScene(saved.scene);});
  render();
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:()=>{if(ui.scene!==state.scene)setScene(ui.scene);else render();}});
    tweak.addSelect(ui,'scene',{label:'评审场景',options:[{label:'日常阻断',value:'blocked'},{label:'历史证据未知',value:'history'},{label:'自动核对等待撮合',value:'job'},{label:'验收能力未接通',value:'unavailable'},{label:'正常运行',value:'healthy'},{label:'检查读取失败',value:'error'},{label:'无审核权限',value:'permission'}]});
    tweak.addSelect(ui,'theme',{label:'界面外观',options:[{label:'跟随外观',value:'auto'},{label:'浅色工作台',value:'light'},{label:'深色工作台',value:'dark'}]});
    if(tweak.supported)root.querySelector('.pt-review-scene').hidden=true;
  }
})();
</script>
