<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公鸡骑自行车 · SVG 2D 动画</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10151c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .stage {
    width: min(96vw, 1180px);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 26px 70px rgba(0, 0, 0, .55);
  }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 900 520" role="img" aria-label="一只公鸡骑着自行车在公路上飞驰">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fa9e0"/>
      <stop offset="55%" stop-color="#9ed6f2"/>
      <stop offset="100%" stop-color="#e7f6ff"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb391"/>
      <stop offset="100%" stop-color="#4d8b72"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d9c57"/>
      <stop offset="100%" stop-color="#376b3d"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4f58"/>
      <stop offset="100%" stop-color="#262a31"/>
    </linearGradient>
    <radialGradient id="bodyGrad" cx="42%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="62%" stop-color="#fdf2dc"/>
      <stop offset="100%" stop-color="#e6cfa4"/>
    </radialGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c4"/>
      <stop offset="70%" stop-color="#ffd257"/>
      <stop offset="100%" stop-color="#ffb32e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- ================= 天空 ================= -->
  <rect width="900" height="520" fill="url(#sky)"/>
  <g transform="translate(748, 92)">
    <circle r="62" fill="url(#sunGrad)">
      <animate attributeName="r" values="62;68;62" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="#ffe07a"/>
    <g stroke="#ffe07a" stroke-width="5" stroke-linecap="round" opacity=".75">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      <line y1="-46" y2="-64"/><line y1="46" y2="64"/>
      <line x1="-46" x2="-64"/><line x1="46" x2="64"/>
      <line x1="-34" y1="-34" x2="-47" y2="-47"/><line x1="34" y1="34" x2="47" y2="47"/>
      <line x1="34" y1="-34" x2="47" y2="-47"/><line x1="-34" y1="34" x2="-47" y2="47"/>
    </g>
  </g>

  <!-- ================= 云 ================= -->
  <g fill="#ffffff" opacity=".92">
    <g>
      <animateTransform attributeName="transform" type="translate" from="930 74" to="-260 74" dur="27s" repeatCount="indefinite"/>
      <ellipse rx="46" ry="20"/><ellipse cx="30" cy="-12" rx="30" ry="19"/><ellipse cx="-30" cy="-6" rx="26" ry="16"/>
    </g>
    <g opacity=".8">
      <animateTransform attributeName="transform" type="translate" from="620 140" to="-320 140" dur="20s" repeatCount="indefinite"/>
      <ellipse rx="34" ry="15"/><ellipse cx="22" cy="-9" rx="22" ry="14"/>
    </g>
    <g opacity=".7">
      <animateTransform attributeName="transform" type="translate" from="1180 46" to="-340 46" dur="34s" repeatCount="indefinite"/>
      <ellipse rx="56" ry="18"/><ellipse cx="-34" cy="-10" rx="30" ry="17"/><ellipse cx="36" cy="-8" rx="28" ry="15"/>
    </g>
  </g>

  <!-- ================= 远山（无缝循环） ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="22s" repeatCount="indefinite"/>
    <g fill="url(#hillFar)">
      <path d="M0 380 L0 300 Q 90 226 180 288 Q 250 330 330 258 Q 420 180 510 276 Q 580 330 660 250 Q 780 170 900 296 L900 380 Z"/>
      <path d="M900 380 L900 300 Q 990 226 1080 288 Q 1150 330 1230 258 Q 1320 180 1410 276 Q 1480 330 1560 250 Q 1680 170 1800 296 L1800 380 Z"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="12s" repeatCount="indefinite"/>
    <g fill="url(#hillNear)">
      <path d="M0 400 L0 352 Q 120 300 230 350 Q 330 392 430 336 Q 540 278 650 344 Q 760 404 900 348 L900 400 Z"/>
      <path d="M900 400 L900 352 Q 1020 300 1130 350 Q 1230 392 1330 336 Q 1440 278 1550 344 Q 1660 404 1800 348 L1800 400 Z"/>
    </g>
  </g>

  <!-- ================= 护栏桩（速度感） ================= -->
  <g stroke="#8a6a43" stroke-width="9" stroke-linecap="round" opacity=".9">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-140 0" dur="0.55s" repeatCount="indefinite"/>
    <g id="posts">
      <line x1="-40" y1="392" x2="-40" y2="360"/><line x1="100" y1="392" x2="100" y2="360"/>
      <line x1="240" y1="392" x2="240" y2="360"/><line x1="380" y1="392" x2="380" y2="360"/>
      <line x1="520" y1="392" x2="520" y2="360"/><line x1="660" y1="392" x2="660" y2="360"/>
      <line x1="800" y1="392" x2="800" y2="360"/><line x1="940" y1="392" x2="940" y2="360"/>
      <line x1="1080" y1="392" x2="1080" y2="360"/><line x1="1220" y1="392" x2="1220" y2="360"/>
    </g>
  </g>
  <rect x="-60" y="364" width="1400" height="7" fill="#a3805a" opacity=".9">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-140 0" dur="0.55s" repeatCount="indefinite"/>
  </rect>

  <!-- ================= 公路 ================= -->
  <rect x="0" y="400" width="900" height="120" fill="url(#road)"/>
  <rect x="0" y="400" width="900" height="6" fill="#c9d3d8" opacity=".5"/>
  <line x1="-80" y1="462" x2="980" y2="462" stroke="#f2d24a" stroke-width="8"
        stroke-dasharray="52 34" stroke-linecap="butt">
    <animate attributeName="stroke-dashoffset" from="0" to="86" dur="0.24s" repeatCount="indefinite"/>
  </line>
  <g fill="#5b6472" opacity=".55">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-190 0" dur="0.34s" repeatCount="indefinite"/>
    <rect x="60" y="418" width="52" height="5" rx="2"/><rect x="250" y="490" width="66" height="5" rx="2"/>
    <rect x="430" y="430" width="40" height="4" rx="2"/><rect x="620" y="482" width="58" height="5" rx="2"/>
    <rect x="800" y="424" width="46" height="4" rx="2"/><rect x="990" y="490" width="66" height="5" rx="2"/>
    <rect x="1160" y="418" width="52" height="5" rx="2"/>
  </g>

  <!-- ================= 速度线 ================= -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".0">
    <g stroke="#eaf4ff">
      <line x1="150" y1="250" x2="235" y2="250">
        <animate attributeName="opacity" values="0;.85;0" dur="0.5s" begin="0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" from="120 0" to="-160 0" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="120" y1="300" x2="210" y2="300">
        <animate attributeName="opacity" values="0;.8;0" dur="0.42s" begin="0.14s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" from="140 0" to="-170 0" dur="0.42s" begin="0.14s" repeatCount="indefinite"/>
      </line>
      <line x1="170" y1="188" x2="240" y2="188">
        <animate attributeName="opacity" values="0;.7;0" dur="0.62s" begin="0.3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" from="110 0" to="-150 0" dur="0.62s" begin="0.3s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- 车与骑手的落地阴影 -->
  <ellipse cx="420" cy="440" rx="180" ry="16" fill="#000" opacity=".28" filter="url(#soft)">
    <animate attributeName="rx" values="180;172;180" dur="0.425s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".28;.2;.28" dur="0.425s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ================================================================
       骑手的公鸡 + 自行车（整体轻微颠簸）
       ================================================================ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -5; 0 2; 0 0" dur="0.425s" repeatCount="indefinite"/>

    <!-- ---------- 自行车后轮 ---------- -->
    <g transform="translate(295, 372)">
      <circle r="62" fill="none" stroke="#1d2126" stroke-width="11"/>
      <circle r="54" fill="none" stroke="#f0c419" stroke-width="5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.85s" repeatCount="indefinite"/>
        <g stroke="#dfe6ea" stroke-width="3.4">
          <line x1="0" y1="-54" x2="0" y2="54"/>
          <line x1="-54" y1="0" x2="54" y2="0"/>
          <line x1="-38" y1="-38" x2="38" y2="38"/>
          <line x1="-38" y1="38" x2="38" y2="-38"/>
        </g>
        <path d="M0 -54 A54 54 0 0 1 54 0" fill="none" stroke="#ffffff" stroke-width="4" opacity=".55"/>
      </g>
      <circle r="9" fill="#2b3138"/>
      <circle r="3.4" fill="#7f8b95"/>
    </g>

    <!-- ---------- 自行车前轮 ---------- -->
    <g transform="translate(545, 372)">
      <circle r="62" fill="none" stroke="#1d2126" stroke-width="11"/>
      <circle r="54" fill="none" stroke="#f0c419" stroke-width="5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.85s" repeatCount="indefinite"/>
        <g stroke="#dfe6ea" stroke-width="3.4">
          <line x1="0" y1="-54" x2="0" y2="54"/>
          <line x1="-54" y1="0" x2="54" y2="0"/>
          <line x1="-38" y1="-38" x2="38" y2="38"/>
          <line x1="-38" y1="38" x2="38" y2="-38"/>
        </g>
        <path d="M0 -54 A54 54 0 0 1 54 0" fill="none" stroke="#ffffff" stroke-width="4" opacity=".55"/>
      </g>
      <circle r="9" fill="#2b3138"/>
      <circle r="3.4" fill="#7f8b95"/>
    </g>

    <!-- ---------- 车架 / 传动 ---------- -->
    <g stroke-linecap="round" fill="none">
      <!-- 链条 -->
      <path d="M410 350 L295 363 A9 9 0 0 0 295 381 L410 394 A22 22 0 0 0 410 350"
            stroke="#3b4149" stroke-width="4.5"/>
      <!-- 后拨/飞轮 -->
      <circle cx="295" cy="372" r="11" fill="#4b525b" stroke="none"/>
      <!-- 车架 -->
      <g stroke="#e03b3b" stroke-width="11">
        <path d="M295 372 L410 372"/>
        <path d="M295 372 L368 262"/>
        <path d="M368 262 L410 372"/>
        <path d="M410 372 L516 278"/>
        <path d="M372 274 L512 268"/>
        <path d="M516 278 L545 372"/>
        <path d="M512 268 L520 240"/>
      </g>
      <!-- 车把 -->
      <g stroke="#2c3238" stroke-width="9">
        <path d="M520 240 Q 540 228 560 238"/>
      </g>
      <!-- 座垫 -->
      <path d="M340 256 Q 366 244 392 256 Q 366 264 340 256 Z" fill="#2c3238" stroke="none"/>
      <!-- 牙盘 -->
      <circle cx="410" cy="372" r="24" fill="#c8ccd2" stroke="#7d858e" stroke-width="3"/>
      <circle cx="410" cy="372" r="6" fill="#3b4149" stroke="none"/>
    </g>

    <!-- ---------- 曲柄 + 脚踏 ---------- -->
    <g transform="translate(410, 372)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.85s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="-26" stroke="#2c3238" stroke-width="7" stroke-linecap="round"/>
        <rect x="-13" y="-34" width="26" height="9" rx="3" fill="#585f68"/>
        <line x1="0" y1="0" x2="0" y2="26" stroke="#3d454e" stroke-width="7" stroke-linecap="round"/>
        <rect x="-13" y="25" width="26" height="9" rx="3" fill="#4a525b"/>
      </g>
    </g>

    <!-- ---------- 公鸡（右后腿，靠后层） ---------- -->
    <g transform="translate(402, 262)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="14;-14;14" dur="0.85s" repeatCount="indefinite"/>
        <path d="M0 0 L8 46 L18 88" fill="none" stroke="#c9902f" stroke-width="12" stroke-linecap="round"/>
        <path d="M18 88 L-2 96 M18 88 L34 98 M18 88 L26 102" fill="none"
              stroke="#c9902f" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ---------- 尾巴 ---------- -->
    <g transform="translate(348, 208)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-6;5;-6" dur="1.1s" repeatCount="indefinite"/>
        <g fill="none" stroke-linecap="round" stroke-width="15">
          <path d="M-6 2 C-52 -6 -96 -44 -110 -96" stroke="#2f7f6b"/>
          <path d="M-4 8 C-58 8 -104 -8 -128 -46" stroke="#d94f30"/>
          <path d="M-2 16 C-52 30 -100 32 -132 12" stroke="#f0b429"/>
          <path d="M0 24 C-40 46 -84 58 -120 52" stroke="#2f7f6b" opacity=".85"/>
        </g>
      </g>
    </g>

    <!-- ---------- 身体 ---------- -->
    <g>
      <ellipse cx="392" cy="220" rx="62" ry="49" fill="url(#bodyGrad)"/>
      <ellipse cx="378" cy="240" rx="46" ry="26" fill="#e9d5ae" opacity=".55"/>
      <!-- 胸羽高光 -->
      <path d="M436 196 Q 456 216 448 240" fill="none" stroke="#ffffff" stroke-width="6" opacity=".6" stroke-linecap="round"/>
    </g>

    <!-- ---------- 脖颈 + 围巾 ---------- -->
    <g>
      <path d="M424 198 C 446 186 466 170 478 152" fill="none" stroke="#fbf1d9" stroke-width="34" stroke-linecap="round"/>
      <!-- 飘动的红围巾 -->
      <g transform="translate(452, 176)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-8;10;-8" dur="0.55s" repeatCount="indefinite"/>
          <path d="M0 0 C-34 6 -66 -4 -96 12 C-66 26 -30 20 4 14 Z" fill="#2fa572"/>
          <path d="M-8 8 C-44 18 -74 30 -104 44 C-70 44 -34 32 -2 20 Z" fill="#25905f" opacity=".9"/>
        </g>
      </g>
    </g>

    <!-- ---------- 翅膀 ---------- -->
    <g transform="translate(398, 214)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="6;-20;6" dur="0.85s" repeatCount="indefinite"/>
        <path d="M0 0 C 30 6 44 28 36 54 C 14 62 -20 52 -34 30 C -22 10 -10 2 0 0 Z" fill="#f4e3c1"/>
        <path d="M0 0 C 30 6 44 28 36 54 C 14 62 -20 52 -34 30 C -22 10 -10 2 0 0 Z"
              fill="none" stroke="#d9bf8c" stroke-width="3"/>
        <g stroke="#d9bf8c" stroke-width="3" fill="none" stroke-linecap="round">
          <path d="M-22 40 Q -6 46 12 44"/>
          <path d="M-14 28 Q 4 34 26 30"/>
          <path d="M-6 16 Q 12 20 34 16"/>
        </g>
      </g>
    </g>

    <!-- ---------- 头 ---------- -->
    <g transform="translate(486, 148)">
      <g>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 2 4; 0 -3; 0 0" dur="0.85s" repeatCount="indefinite"/>
        <!-- 鸡冠 -->
        <path d="M-18 -22 C-14 -44 2 -36 4 -50 C 12 -38 22 -42 24 -28 C 32 -34 36 -20 24 -14 Z" fill="#e2413a"/>
        <path d="M-18 -22 C-14 -44 2 -36 4 -50 C 12 -38 22 -42 24 -28 C 32 -34 36 -20 24 -14 Z"
              fill="none" stroke="#bd3029" stroke-width="2.5"/>
        <!-- 头 -->
        <circle r="27" fill="#fdf4e0" stroke="#e2cfa6" stroke-width="2.5"/>
        <!-- 眼 -->
        <circle cx="9" cy="-6" r="7.5" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
        <circle cx="11" cy="-6" r="3.8" fill="#221a12">
          <animate attributeName="r" values="3.8;3.8;0.6;3.8" keyTimes="0;0.9;0.94;1" dur="3.1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="12.6" cy="-7.6" r="1.3" fill="#ffffff"/>
        <!-- 上喙 -->
        <path d="M22 -8 L58 2 L22 8 Z" fill="#f5a623" stroke="#d78a15" stroke-width="2"/>
        <!-- 下喙（张嘴打鸣） -->
        <g transform="translate(22, 8)">
          <g>
            <animateTransform attributeName="transform" type="rotate"
                              values="0;0;20;4;18;0;0" keyTimes="0;0.42;0.5;0.56;0.62;0.7;1"
                              dur="2.4s" repeatCount="indefinite"/>
            <path d="M0 -2 L34 6 L0 10 Z" fill="#e6951b" stroke="#cf7f10" stroke-width="2"/>
          </g>
        </g>
        <!-- 肉垂 -->
        <path d="M18 12 C 30 20 26 36 14 34 C 6 30 8 18 18 12 Z" fill="#e2413a" opacity=".95"/>
        <path d="M10 16 C 18 24 14 36 6 32 C 0 28 2 20 10 16 Z" fill="#c8352d" opacity=".9"/>
      </g>
    </g>

    <!-- ---------- 打鸣文字 ---------- -->
    <g transform="translate(566, 106)">
      <g>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.5;0.78;0.92" dur="2.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="0.7;1.08;1;0.94" keyTimes="0;0.5;0.7;1" dur="2.4s" repeatCount="indefinite" additive="sum"/>
        <text x="0" y="0" font-size="30" font-weight="800" fill="#d94f30" stroke="#fff" stroke-width="5"
              paint-order="stroke" transform="rotate(-8)">喔喔喔——！</text>
      </g>
    </g>

    <!-- ---------- 公鸡（左前腿，最前层） ---------- -->
    <g transform="translate(384, 264)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-14;14;-14" dur="0.85s" repeatCount="indefinite"/>
        <path d="M0 0 L10 44 L22 84" fill="none" stroke="#eab243" stroke-width="13" stroke-linecap="round"/>
        <path d="M22 84 L0 92 M22 84 L38 94 M22 84 L30 98" fill="none"
              stroke="#eab243" stroke-width="7" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 翅膀尖端搭在车把上的羽毛 -->
    <g transform="translate(516, 244)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;3 -3;0 0" dur="0.85s" repeatCount="indefinite"/>
        <path d="M-8 -6 C 10 -12 24 -4 26 6 C 12 12 -4 6 -8 -6 Z" fill="#f4e3c1" stroke="#d9bf8c" stroke-width="2.5"/>
      </g>
    </g>
  </g>

  <!-- ================= 前景草丛 ================= -->
  <g stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="0.42s" repeatCount="indefinite"/>
    <g stroke="#2e6b3c" stroke-width="7">
      <path d="M40 512 C 46 486 34 470 30 458"/><path d="M56 512 C 58 490 70 476 78 462"/>
      <path d="M340 512 C 346 486 334 470 330 458"/><path d="M356 512 C 358 490 370 476 378 462"/>
      <path d="M640 512 C 646 486 634 470 630 458"/><path d="M656 512 C 658 490 670 476 678 462"/>
      <path d="M940 512 C 946 486 934 470 930 458"/><path d="M956 512 C 958 490 970 476 978 462"/>
    </g>
    <g fill="#e94f6b">
      <circle cx="150" cy="480" r="7"/><circle cx="470" cy="496" r="6"/>
      <circle cx="770" cy="482" r="7"/><circle cx="1070" cy="496" r="6"/>
    </g>
  </g>

  <!-- 路面前景暗带 -->
  <rect x="0" y="502" width="900" height="18" fill="#171b21" opacity=".9"/>
</svg>
</div>
</body>
</html>
