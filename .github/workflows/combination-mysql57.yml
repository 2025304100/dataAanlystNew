name: Combination MySQL 5.7 acceptance

on:
  push:
    branches: [main, master, "main_work*", "codex/*"]
  pull_request:
  workflow_dispatch:

jobs:
  combination-mysql57-required:
    runs-on: ubuntu-latest
    # G4 adds 23 fresh, fully migrated schemas; keep the existing real-model lanes.
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:5.7.26
        env:
          MYSQL_ROOT_PASSWORD: ci_combination_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_combination_pw"
          --health-interval=10s --health-timeout=5s --health-retries=18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-e2e.txt
      - name: Use matching 5.7 dump and restore clients
        env:
          MYSQL57_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          printf '#!/bin/sh\nexec docker exec -i -e MYSQL_PWD %s mysqldump "$@"\n' "$MYSQL57_CONTAINER" > /tmp/combination-mysqldump
          printf '#!/bin/sh\nexec docker exec -i -e MYSQL_PWD %s mysql "$@"\n' "$MYSQL57_CONTAINER" > /tmp/combination-mysql
          chmod +x /tmp/combination-mysqldump /tmp/combination-mysql
      - name: Pure migrations, restart, concurrent gates, recovery and no-loss replay
        env:
          COMBINATION_MYSQL57_URL: mysql+pymysql://root:ci_combination_pw@127.0.0.1:3306/
          MYSQLDUMP_BIN: /tmp/combination-mysqldump
          MYSQL_BIN: /tmp/combination-mysql
        run: python scripts/verify_combination_mysql57.py --prefix codex_combination_ci_${{ github.run_id }}_${{ github.run_attempt }} --evidence-dir tmp/combination-ci
      - name: Real admission display HTTP flow on a fresh retained-model copy
        env:
          ADMISSION_DISPLAY_SOURCE_URL: mysql+pymysql://root:ci_combination_pw@127.0.0.1:3306/codex_combination_ci_${{ github.run_id }}_${{ github.run_attempt }}_auto_http
          MYSQLDUMP_BIN: /tmp/combination-mysqldump
          MYSQL_BIN: /tmp/combination-mysql
        run: python scripts/verify_combination_admission_display.py --target-database codex_combination_display_${{ github.run_id }}_${{ github.run_attempt }} --evidence-dir tmp/combination-ci/admission-display
      - name: Preserve complete evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combination-mysql57-evidence
          path: tmp/combination-ci
          if-no-files-found: error
