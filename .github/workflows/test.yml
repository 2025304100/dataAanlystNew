name: Test Suite

on:
  push:
    # 为什么要带上 main_work*：实际发生过——闸门逻辑（分片表达式、marker、依赖钉版本）都在工作
    # 分支上改，但触发列表只有 main/master，于是这些改动**从未被 CI 跑过**，
    # “推上去让 CI 验证”根就不成立。工作分支必须有真实反馈，否则闸门改动只能靠本地跑。
    branches: [main, master, "main_work*", "codex/*"]
  pull_request:
    branches: [main, master]
  # 允许在 Actions 页面手动跑指定分支（临时验证/不消耗额度的情况下按需跑）
  workflow_dispatch: {}

jobs:
  governance-contracts-required:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: G4 HTTP contracts and inspection recovery, no skips or missing cases
        run: python scripts/verify_g4_contracts.py --evidence-dir tmp/g4-contract-ci
      - name: Preserve G4 evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-contract-evidence
          path: tmp/g4-contract-ci
          if-no-files-found: error

  # ── 后端白盒测试（无需后端运行）4 片并行 ────────────────────
  # 为什么分片：单 job 跑全量 whitebox 要 47~56 分钟，是整个流水线的长板。
  # 为什么不手写路径清单：清单会过期，新目录没被任何一条覆盖就是**静默漏测**
  # （本项目发生过 141 个文件永远不进闸门的同族事故）。现在改成先收集、
  # 再按收集结果分片（scripts/ci_shard.py），覆盖由收集决定。
  backend-whitebox:
    runs-on: ubuntu-latest
    strategy:
      # 不要 fail-fast：一片红就取消其余片，会遮蔽同时存在的其他红因
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: backend-whitebox shard ${{ matrix.shard }}/4
    env:
      # 探针实验（分支 main_work_vbtjit，run f64b03c4）证明：之前 4 片里的 vectorbt 红
      # 不是“numba 版本不对”，而是 **CI 在测产品默认不用的那条路径**：
      # VectorBTConfig.disable_numba 默认 True，靠导入前的 os.environ.setdefault 生效；
      # 若 numba 已被其它 import 拉起来，那句就是空操作 → JIT 仍在跑 → 报
      # get_call_template。在进程启动前就设好这个变量后，那 2 条用例在阻断道里是绿的。
      # 下方另有一个步骤故意开着 JIT 跑同一文件（non-blocking）：因为 CLI 的
      # --enable-numba 是公开 opt-in 且**仍然坏**，要让它可见而不是把它藏起来。
      NUMBA_DISABLE_JIT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Env probe (versions + dependency consistency; report only)
        # 为什么要这一步：CI 里 vectorbt 用例报 `AttributeError: 'function' object has no
        # attribute 'get_call_template'`，而本地 venv 根本没装 vectorbt —— 拿不到任何证据，
        # 于是只能靠猜版本号（不接受）。requirements.txt 也没声明 numba/llvmlite，
        # 所以“CI 实际装了哪套 ABI”本身就是未知量。这一步把它变成可测量的事实：
        # pip check 会直接说出“X has requirement Y==Z, but you have Y W”。
        # 只报告、不失败：它不是闸门，是仪表。
        if: always()
        run: |
          python -m pip check || true
          python - <<'PY'
          import importlib.metadata as m
          rows = []
          for p in ("vectorbt", "numba", "llvmlite", "numpy", "pandas", "plotly", "scipy", "scikit-learn"):
              try:
                  rows.append(f"{p}=={m.version(p)}")
              except Exception:
                  rows.append(f"{p}=MISSING")
          imports = []
          for mod in ("numpy", "pandas", "numba", "vectorbt"):
              try:
                  x = __import__(mod)
                  imports.append(f"{mod}:OK:{getattr(x, '__version__', '?')}")
              except Exception as e:
                  imports.append(f"{mod}:FAIL:{type(e).__name__}:{str(e)[:120]}")
          line = " | ".join(rows) + "  ||  " + " ".join(imports)
          print(line)
          # 同时发 annotation：Actions 的 job 日志对匿名请求是 403，只写 stdout 的话
          # 自动化侧（以及我这边）依然读不到 —— annotation 是唯一可查询的通道。
          esc = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=Env probe::{esc}")
          PY
        continue-on-error: true
      - name: Shard coverage self-check
        # 断言 4 片并起来 == 全量收集（丢文件 / 重文件直接失败），防静默漏测
        run: python scripts/ci_shard.py --marker "whitebox and not slow and not env_gap" --groups 4 --plan
      - name: Run whitebox tests (this shard)
        run: |
          set -o pipefail
          python scripts/ci_shard.py --marker "whitebox and not slow and not env_gap" --groups 4 --group ${{ matrix.shard }} 2>&1 | tee /tmp/ci-whitebox.log
      - name: Publish failure digest
        # Actions 的 job 日志接口对匿名请求是 403：红因只写在日志里，自动化侧就只知道“红了”而不知道为什么。
        # 这一步把 FAILED/ERROR 摘要发到 annotations 与 step summary；它自身永不失败（否则会把真因掉包）。
        if: failure()
        run: python scripts/ci_digest.py /tmp/ci-whitebox.log || true
      # 两类不进阻断闸门：1) slow = 真实联网用例（runner 拉不到深交所/东财时，红的是网络不是
      # 代码）；2) env_gap = 已定性的第三方依赖 ABI 缺陷（当前：vectorbt 0.28.5 与 1.0.0 在
      # 任何支持 numpy 2.5 的 numba 上都报 get_call_template；退 numba 会逼全项目降 numpy）。
      # 两者都**每轮真实执行并打印结果**（continue-on-error），所以不会悄悄消失；
      # 用 env_gap 必须写清理由并进台账，禁止拿它藏真 bug（区别于 xfail：那会慢慢变成没测）。
      - name: Run slow / env-gap whitebox tests - non-blocking
        continue-on-error: true
        run: pytest -m "whitebox and (slow or env_gap)" -q --tb=short -rX -rf
      - name: VectorBT with numba JIT enabled (opt-in path - non-blocking)
        # 产品默认走非 JIT（上方 job env），阻断道测的就是那条路。
        # 但 scripts/backtest_vectorbt.py --enable-numba 是公开可选，而在当前 numba
        # 版本下 JIT-on 仍报 get_call_template（探针已实测）。这一步不拦闸门，
        # 但每轮真实跑一遍并打印结果：把已知缺陷放在明处，而不是当成不存在。
        # 修好（或决定去掉该 CLI 选项）后，删掉这一步。
        env:
          NUMBA_DISABLE_JIT: "0"
        continue-on-error: true
        run: pytest tests/test_whitebox_vectorbt_backtest.py -q --tb=short -rs -rf

  # ── 前端测试 ──────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run frontend tests
        run: cd frontend && npm test

  # ── 后端黑盒测试（需启动后端）────────────────────────────
  backend-blackbox:
    runs-on: ubuntu-latest
    # 与生产同方言：黑盒测的是跑在 MySQL 上的应用，而不是退化成 SQLite。
    # 实测代价：CI 没 MySQL 时应用静默走 SQLite，出现“本地绿、CI 红”的
    # PUT → 409 DB_INTEGRITY_VIOLATION（两方言约束行为不一致）。
    # 注意：services 块拿不到 job 的 env 上下文，所以下面口令与步骤里的必须字面一致。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw      # 临时容器内口令，非真实凭据
          MYSQL_DATABASE: gpfx_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pw"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 写入 CI 数据库配置（必须写文件：load_db_config() 不看环境变量）
        env:
          CI_DB_HOST: 127.0.0.1
          CI_DB_PORT: "3306"
          CI_DB_NAME: gpfx_ci
          CI_DB_USER: root
          CI_DB_PASSWORD: ci_root_pw
        run: python scripts/ci_write_db_config.py
      # 不跑 `alembic upgrade head`：建库交给后端启动时的 init_db()（create_all + _ensure_* 补丁），
      # 这与“新机器实际走的那条路”一致（已核：无 db_config.json 时应用就是这么建库的）。
      # 为什么不能走 alembic：迁移链在 MySQL 上目前不可重放（已修 3 层：TEXT 默认值 1101、
      # version_num 宽度 1406、引擎退 MyISAM 导致 1071；仍剩 0032 的 1215 列型不匹配）。
      # 该缺陷已挂账，不靠“CI 不跑迁移”假装它不存在：blackbox job 有全表 drift 检查托底。
      - name: Start backend
        env:
          # 间歇红取证（run f64b03c4）：test_blackbox_api_mgmt 的 3 个 PUT 报
          # httpx.ReadTimeout（客户端超时 30s），而同一组在主线上一轮是绿的。
          # 已排除“内存配置锁”（网络在锁外）；剩两个候选瓶颈的共同源头都是
          # “后端一起来就拿空库去同步全市场”：5 个线程带重试访问 akshare，
          # 既可能占满同步路由的线程池，也可能与写 akshare_api_config 的
          # 事务争行锁（InnoDB 默认等 50s > 客户端 30s）。e2e 已同样关掉。
          # 不下调试的超时、也不加 sleep 掩盖症状：下一轮 CI 负责定论。
          AUTO_UNIVERSE_SYNC_ON_STARTUP: "0"
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          sleep 5
      - name: Wait for backend
        # 必须在等不到时让步骤失败：旧写法 `for i in {1..30}; do ... done` 即使
        # 一次也没连通也返回 0，后面 blackbox 会因“后端不在”全量 skip，
        # 于是 job 以 0 failed 绿——实测发生过（79 skipped / 0 failed）。
        run: |
          ok=0
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "backend never became healthy on :8000" >&2
            tail -n 80 /tmp/backend.log >&2 || true
            exit 1
          fi
      - name: Run blackbox tests
        # REQUIRE_LIVE_BACKEND=1：后端不在时用例直接失败，不拿零覆盖当通过
        # -rX：把 xpassed（被放宽但其实能过的用例）列进日志，不然它们会默默消失在统计里
        env:
          REQUIRE_LIVE_BACKEND: "1"
        run: |
          set -o pipefail
          pytest -m blackbox --tb=short -q -rX -rf 2>&1 | tee /tmp/ci-blackbox.log
      - name: Publish failure digest
        if: failure()
        run: python scripts/ci_digest.py /tmp/ci-blackbox.log || true
      - name: 全表 Schema 漂移检查（模型 vs 真实库）
        # 迁移链目前不可重放，所以“库长得对不对”只能靠这道检查兜着：它把全部 ORM 表
        # 与刚建出来的库逐项对比。先不阻断（已知有历史漂移，阻断只会变成常驻红灯），
        # 但结果会写进 step summary 与 annotations —— 从“看不见”变成“每轮都报”。
        continue-on-error: true
        run: python scripts/verify_schema_drift.py --quiet-ok

  # ── E2E 测试（需前后端 + 浏览器）─────────────────────────
  e2e:
    runs-on: ubuntu-latest
    # 同 blackbox：E2E 跑的是真实后端，必须与生产同方言（MySQL）。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw      # 临时容器内口令，非真实凭据
          MYSQL_DATABASE: gpfx_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pw"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Install Playwright
        run: python -m playwright install chromium
      - name: 写入 CI 数据库配置（必须写文件：load_db_config() 不看环境变量）
        env:
          CI_DB_HOST: 127.0.0.1
          CI_DB_PORT: "3306"
          CI_DB_NAME: gpfx_ci
          CI_DB_USER: root
          CI_DB_PASSWORD: ci_root_pw
        run: python scripts/ci_write_db_config.py
      # 不跑 `alembic upgrade head`：建库交给后端启动时的 init_db()（create_all + _ensure_* 补丁），
      # 这与“新机器实际走的那条路”一致（已核：无 db_config.json 时应用就是这么建库的）。
      # 为什么不能走 alembic：迁移链在 MySQL 上目前不可重放（已修 3 层：TEXT 默认值 1101、
      # version_num 宽度 1406、引擎退 MyISAM 导致 1071；仍剩 0032 的 1215 列型不匹配）。
      # 该缺陷已挂账，不靠“CI 不跑迁移”假装它不存在：blackbox job 有全表 drift 检查托底。
      - name: Start backend
        env:
          # CI 每次都是空库，启动自动同步会拉起 5 个线程带重试地访问 akshare：
          # 拖慢整轮 e2e，并在前端弹出同步进度模态遮挡视图导航的点击（实测间歇红）。
          # 关掉它不影响 e2e 要验的东西；生产默认仍为开启。
          AUTO_UNIVERSE_SYNC_ON_STARTUP: "0"
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          sleep 5
      - name: Start frontend
        run: |
          cd frontend && npm run dev > /tmp/frontend.log 2>&1 &
          sleep 10
      - name: Wait for backend and frontend
        # 同 blackbox job：两个服务都必须真连通，否则后面的 e2e 会全体 skip 而 job 绿
        run: |
          ok=0
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "backend not healthy" >&2; tail -n 80 /tmp/backend.log >&2 || true; exit 1; fi
          ok=0
          for i in {1..30}; do
            if curl -sf http://localhost:5173 >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "frontend not reachable" >&2; tail -n 80 /tmp/frontend.log >&2 || true; exit 1; fi
      - name: 预置 e2e 最小数据（CI-only 双门禁）
        # 为什么需要：「组合交易 → 持仓成员」那页的行来自 GET /portfolios/{id}/positions，
        # 而后端 init_db() 建出的空库 symbols=0 / portfolios=0 / positions=0，页面只能渲染
        # 空态占位行 → "行内应有再平衡/清仓入口"的用例在 CI 必红（本地开发库有数据，永远绿）。
        # symbol_id 是外键且 CI 拉不到 akshare 行情底座，用例无法自己造数据，所以由环境提供种子。
        # 双门禁在脚本里：非 CI=true 不执行；目标库不在 CI 库名白名单内直接 exit 2、不写一行。
        # 必须排在"等后端健康"之后：表是后端启动时的 init_db() 建的，跑早了会找不到表。
        run: python scripts/ci_seed_e2e_fixture.py
      - name: Run E2E tests
        env:
          REQUIRE_LIVE_BACKEND: "1"
          # 服务连通但用例几乎没执行（浏览器不可用 / 选择器大面积退化成 skip /
          # marker 被删空导致收集为 0）同样等于零覆盖，必须判红。
          # 断言实现在 tests/conftest.py 的 pytest_sessionfinish，
          # 阈值与说明见 tests/_e2e_coverage_guard.py。
          E2E_REQUIRE_MINIMUM: "1"
        run: |
          set -o pipefail
          # -s 不是风格问题：pytest 默认是 **fd 级**捕获，用例里发的 ::notice
          # （用于上报“预检模态阻塞导航”是否正在发生）会被一并吞掉，
          # annotation 根本不会生成——实测无 -s 时两条探测行都不输出。
          pytest tests/e2e/ -m e2e -s --tb=short -q -rX -rf 2>&1 | tee /tmp/ci-e2e.log
      - name: Publish failure digest
        if: failure()
        run: python scripts/ci_digest.py /tmp/ci-e2e.log || true
