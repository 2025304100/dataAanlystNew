name: Test Suite

on:
  push:
    # 为什么要带上 main_work*：实际发生过——闸门逻辑（分片表达式、marker、依赖钉版本）都在工作
    # 分支上改，但触发列表只有 main/master，于是这些改动**从未被 CI 跑过**，
    # “推上去让 CI 验证”根就不成立。工作分支必须有真实反馈，否则闸门改动只能靠本地跑。
    branches: [main, master, "main_work*"]
  pull_request:
    branches: [main, master]
  # 允许在 Actions 页面手动跑指定分支（临时验证/不消耗额度的情况下按需跑）
  workflow_dispatch: {}

jobs:
  # ── 后端白盒测试（无需后端运行）4 片并行 ────────────────────
  # 为什么分片：单 job 跑全量 whitebox 要 47~56 分钟，是整个流水线的长板。
  # 为什么不手写路径清单：清单会过期，新目录没被任何一条覆盖就是**静默漏测**
  # （本项目发生过 141 个文件永远不进闸门的同族事故）。现在改成先收集、
  # 再按收集结果分片（scripts/ci_shard.py），覆盖由收集决定。
  backend-whitebox:
    runs-on: ubuntu-latest
    strategy:
      # 不要 fail-fast：一片红就取消其余片，会遮蔽同时存在的其他红因
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: backend-whitebox shard ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Shard coverage self-check
        # 断言 4 片并起来 == 全量收集（丢文件 / 重文件直接失败），防静默漏测
        run: python scripts/ci_shard.py --marker "whitebox and not slow" --groups 4 --plan
      - name: Run whitebox tests (this shard)
        run: |
          set -o pipefail
          python scripts/ci_shard.py --marker "whitebox and not slow" --groups 4 --group ${{ matrix.shard }} 2>&1 | tee /tmp/ci-whitebox.log
      - name: Publish failure digest
        # Actions 的 job 日志接口对匿名请求是 403：红因只写在日志里，自动化侧就只知道“红了”而不知道为什么。
        # 这一步把 FAILED/ERROR 摘要发到 annotations 与 step summary；它自身永不失败（否则会把真因掉包）。
        if: failure()
        run: python scripts/ci_digest.py /tmp/ci-whitebox.log || true
      # 真实联网用例（带 @pytest.mark.slow，如 ak.stock_info_sz_name_code 等）不进阻断闸门：
      # GitHub runner 拉不到深交所/东财时，红的是网络而不是代码，会把闸门变成没人看的噪声。
      # 但仍单独跑一轮且保留结果可见（continue-on-error），所以不会悄悄消失。
      - name: Run slow (real-network) whitebox tests — non-blocking
        continue-on-error: true
        run: pytest -m "whitebox and slow" -q --tb=short -rX

  # ── 前端测试 ──────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run frontend tests
        run: cd frontend && npm test

  # ── 后端黑盒测试（需启动后端）────────────────────────────
  backend-blackbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start backend
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          sleep 5
      - name: Wait for backend
        # 必须在等不到时让步骤失败：旧写法 `for i in {1..30}; do ... done` 即使
        # 一次也没连通也返回 0，后面 blackbox 会因“后端不在”全量 skip，
        # 于是 job 以 0 failed 绿——实测发生过（79 skipped / 0 failed）。
        run: |
          ok=0
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "backend never became healthy on :8000" >&2
            tail -n 80 /tmp/backend.log >&2 || true
            exit 1
          fi
      - name: Run blackbox tests
        # REQUIRE_LIVE_BACKEND=1：后端不在时用例直接失败，不拿零覆盖当通过
        # -rX：把 xpassed（被放宽但其实能过的用例）列进日志，不然它们会默默消失在统计里
        env:
          REQUIRE_LIVE_BACKEND: "1"
        run: |
          set -o pipefail
          pytest -m blackbox --tb=short -q -rX -rf 2>&1 | tee /tmp/ci-blackbox.log
      - name: Publish failure digest
        if: failure()
        run: python scripts/ci_digest.py /tmp/ci-blackbox.log || true

  # ── E2E 测试（需前后端 + 浏览器）─────────────────────────
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Install Playwright
        run: python -m playwright install chromium
      - name: Start backend
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          sleep 5
      - name: Start frontend
        run: |
          cd frontend && npm run dev > /tmp/frontend.log 2>&1 &
          sleep 10
      - name: Wait for backend and frontend
        # 同 blackbox job：两个服务都必须真连通，否则后面的 e2e 会全体 skip 而 job 绿
        run: |
          ok=0
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "backend not healthy" >&2; tail -n 80 /tmp/backend.log >&2 || true; exit 1; fi
          ok=0
          for i in {1..30}; do
            if curl -sf http://localhost:5173 >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "frontend not reachable" >&2; tail -n 80 /tmp/frontend.log >&2 || true; exit 1; fi
      - name: Run E2E tests
        env:
          REQUIRE_LIVE_BACKEND: "1"
          # 服务连通但用例几乎没执行（浏览器不可用 / 选择器大面积退化成 skip /
          # marker 被删空导致收集为 0）同样等于零覆盖，必须判红。
          # 断言实现在 tests/conftest.py 的 pytest_sessionfinish，
          # 阈值与说明见 tests/_e2e_coverage_guard.py。
          E2E_REQUIRE_MINIMUM: "1"
        run: |
          set -o pipefail
          pytest tests/e2e/ -m e2e --tb=short -q -rX -rf 2>&1 | tee /tmp/ci-e2e.log
      - name: Publish failure digest
        if: failure()
        run: python scripts/ci_digest.py /tmp/ci-e2e.log || true
