name: Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 后端白盒测试（无需后端运行）──────────────────────────
  backend-whitebox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run whitebox tests
        run: pytest -m whitebox --tb=short -q

  # ── 前端测试 ──────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run frontend tests
        run: cd frontend && npm test

  # ── 后端黑盒测试（需启动后端）────────────────────────────
  backend-blackbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start backend
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          sleep 5
      - name: Wait for backend
        # 必须在等不到时让步骤失败：旧写法 `for i in {1..30}; do ... done` 即使
        # 一次也没连通也返回 0，后面 blackbox 会因“后端不在”全量 skip，
        # 于是 job 以 0 failed 绿——实测发生过（79 skipped / 0 failed）。
        run: |
          ok=0
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "backend never became healthy on :8000" >&2
            tail -n 80 /tmp/backend.log >&2 || true
            exit 1
          fi
      - name: Run blackbox tests
        # REQUIRE_LIVE_BACKEND=1：后端不在时用例直接失败，不拿零覆盖当通过
        env:
          REQUIRE_LIVE_BACKEND: "1"
        run: pytest -m blackbox --tb=short -q

  # ── E2E 测试（需前后端 + 浏览器）─────────────────────────
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Install Playwright
        run: python -m playwright install chromium
      - name: Start backend
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          sleep 5
      - name: Start frontend
        run: |
          cd frontend && npm run dev > /tmp/frontend.log 2>&1 &
          sleep 10
      - name: Wait for backend and frontend
        # 同 blackbox job：两个服务都必须真连通，否则后面的 e2e 会全体 skip 而 job 绿
        run: |
          ok=0
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "backend not healthy" >&2; tail -n 80 /tmp/backend.log >&2 || true; exit 1; fi
          ok=0
          for i in {1..30}; do
            if curl -sf http://localhost:5173 >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "frontend not reachable" >&2; tail -n 80 /tmp/frontend.log >&2 || true; exit 1; fi
      - name: Run E2E tests
        env:
          REQUIRE_LIVE_BACKEND: "1"
        run: pytest tests/e2e/ -m e2e --tb=short -q
