<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs) => {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key,value]) => node.setAttribute(key,value));
    return node;
  };
  for (const id of ['rear-spokes','front-spokes']) {
    for (let i=0;i<16;i++) {
      const a=i*Math.PI/8;

    $(id).appendChild(el('rect',{x:72,y:-5,width:14,height:10,rx:3,fill:'#edb65e',stroke:'none'}));
  }
  for(const id of ['back-pedal','front-pedal']) {
    $(id).appendChild(el('rect',{x:-16,y:-4,width:32,height:8,rx:3,fill:'#304d49'}));
    $(id).appendChild(el('path',{d:'M-10-1H10',stroke:'#829584','stroke-width':1.5}));
  }
  const nodes={};
  ['vehicle','rear-spokes','front-spokes','gear','crank','front-pedal','back-pedal','front-leg-path','back-leg-path','front-toes','back-toes','tail','scarf','eye','clouds','scenery','foreground','road-markings','butterfly','flying-birds','wind','bike-shadow'].forEach(id=>nodes[id]=$(id));
  let running=true,speed=1,time=0,last=null,toastTimer,ringTimer,audioContext;
  const pedalRadius=35;
  function leg(hipX,hipY,footX,footY,path,toes) {
    const dx=footX-hipX,dy=footY-hipY,d=Math.hypot(dx,dy);
    const upper=98,lower=99;
    const a=(upper*upper-lower*lower+d*d)/(2*d);
    const h=Math.sqrt(Math.max(0,upper*upper-a*a));
    const kneeX=hipX+a*dx/d+h*dy/d,kneeY=hipY+a*dy/d-h*dx/d;
    path.setAttribute('d',`M${hipX} ${hipY}L${kneeX} ${kneeY}L${footX} ${footY-5}`);
    toes.setAttribute('d',`M${footX-7} ${footY-5}q12-5 24 2m-8-2 4 5`);
  }
  function render(t) {
    const phase=t*2.8,angle=phase*180/Math.PI;
    const frontX=800+Math.cos(phase)*pedalRadius,frontY=650+Math.sin(phase)*pedalRadius;
    const backX=800-Math.cos(phase)*pedalRadius,backY=650-Math.sin(phase)*pedalRadius;
    const ground=t*360;
    nodes['rear-spokes'].setAttribute('transform',`rotate(${angle*1.25})`);
    nodes['front-spokes'].setAttribute('transform',`rotate(${angle*1.25})`);
    nodes.gear.setAttribute('transform',`translate(800 650) rotate(${angle})`);
    nodes.crank.setAttribute('d',`M${backX} ${backY}L${frontX} ${frontY}`);
    nodes['front-pedal'].setAttribute('transform',`translate(${frontX} ${frontY})`);
    nodes['back-pedal'].setAttribute('transform',`translate(${backX} ${backY})`);
    leg(800,499,frontX,frontY,nodes['front-leg-path'],nodes['front-toes']);
    leg(779,500,backX,backY,nodes['back-leg-path'],nodes['back-toes']);
    nodes.vehicle.setAttribute('transform',`translate(0 ${Math.sin(phase*2)*1.5})`);
    nodes.tail.setAttribute('transform',`rotate(${Math.sin(phase)*2.5} 742 478)`);
    nodes.scarf.setAttribute('transform',`rotate(${Math.sin(phase*2.1)*5} 876 391)`);
    nodes.eye.setAttribute('transform',`translate(0 338) scale(1 ${Math.pow(Math.max(0,Math.cos(t*.7)),80)>.87?.13:1}) translate(0 -338)`);
    nodes.clouds.setAttribute('transform',`translate(${-((t*10)%1440)} 0)`);
    nodes.scenery.setAttribute('transform',`translate(${-((ground*.23)%1440)} 0)`);
    nodes.foreground.setAttribute('transform',`translate(${-((ground*1.12)%1440)} 0)`);
    nodes['road-markings'].setAttribute('transform',`translate(${-ground%180} 0)`);
    nodes.butterfly.setAttribute('transform',`translate(${1150+Math.sin(t*1.1)*24} ${490+Math.sin(t*2.2)*20}) rotate(${Math.sin(t*2.2)*12}) scale(${.75+Math.abs(Math.sin(t*12))*.25} 1)`);
    nodes['flying-birds'].setAttribute('transform',`translate(${Math.sin(t*.4)*25} ${Math.sin(t*1.3)*5})`);
    nodes.wind.setAttribute('opacity',.2+(Math.sin(t*5)+1)*.12);
    nodes['bike-shadow'].setAttribute('rx',255+Math.sin(phase*2)*3);
  }
  function frame(now) {
    if(last!==null && running) time+=Math.min((now-last)/1000,.05)*speed;
    last=now;
    if(running) render(time);
    requestAnimationFrame(frame);
  }
  function togglePlay() {
    running=!running;
    $('play-icon').setAttribute('d',running?'M3 2h3v10H3zm5 0h3v10H8z':'M3 1.5 12 7l-9 5.5Z');
    $('play-label').textContent=running?'歇一会儿':'继续追风';
    $('play').setAttribute('aria-label',running?'暂停动画':'播放动画');
    $('play').setAttribute('aria-pressed',String(!running));
  }
  function ring() {
    clearTimeout(toastTimer);clearTimeout(ringTimer);
    $('toast').classList.add('show');
    $('bell').classList.remove('ringing');
    requestAnimationFrame(()=>requestAnimationFrame(()=>$('bell').classList.add('ringing')));
    toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800);
    ringTimer=setTimeout(()=>$('bell').classList.remove('ringing'),1400);
    try {
      const Audio=window.AudioContext||window.webkitAudioContext;
      if(!Audio) return;
      audioContext ||= new Audio();
      audioContext.resume().then(()=>{
        const now=audioContext.currentTime;
        [0,.17].forEach((offset,index)=>{
          const osc=audioContext.createOscillator(),gain=audioContext.createGain();
          osc.type='sine';osc.frequency.value=index?1760:2240;
          gain.gain.setValueAtTime(0,now+offset);
          gain.gain.linearRampToValueAtTime(.07,now+offset+.006);
          gain.gain.exponentialRampToValueAtTime(.0001,now+offset+.8);
          osc.connect(gain);gain.connect(audioContext.destination);
          osc.start(now+offset);osc.stop(now+offset+.85);
        });
      }).catch(()=>{});
    } catch (_) { /* Visual bell remains available if audio is unavailable. */ }
  }
  $('play').addEventListener('click',togglePlay);
  $('ring').addEventListener('click',ring);
  $('speed').addEventListener('input',event=>{speed=Number(event.target.value);$('speed-value').value=speed.toFixed(1)+'×';});
  $('theme').addEventListener('click',()=>{
    const night=document.body.classList.toggle('night');
    $('theme-label').textContent=night?'天亮':'入夜';
    $('theme').setAttribute('aria-pressed',String(night));
    $('theme').setAttribute('aria-label',night?'切换到白天':'切换到夜晚');
    document.querySelector('meta[name="theme-color"]').content=night?'#1d343e':'#f7f3e8';
  });
  document.addEventListener('keydown',event=>{
    if(event.target.closest('input,button,textarea,[contenteditable="true"]')||event.repeat||event.ctrlKey||event.metaKey||event.altKey) return;
    if(event.code==='Space'){event.preventDefault();togglePlay();}
    if(event.code==='KeyB')ring();
  });
  document.addEventListener('visibilitychange',()=>{last=null;});
  render(0);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
