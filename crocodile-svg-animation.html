<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SVG 鳄鱼动画 · 沼泽黄昏</title>
<style>
  :root {
    --sky-top: #2b1b4d;
    --sky-mid: #b64a7a;
    --sky-low: #f6a35c;
    --water: #14344a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0d1117;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .stage {
    width: min(96vw, 1100px);
  }
  h1 {
    color: #e8d9c5;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 4px;
    text-align: center;
    margin-bottom: 10px;
    opacity: .8;
  }
  svg { display: block; width: 100%; height: auto; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.55); }

  /* ============ 动画定义 ============ */

  /* 鳄鱼整体：缓慢前进（外层分组） */
  .gator-cruise {
    animation: cruise 14s linear infinite;
  }
  @keyframes cruise {
    0%   { transform: translateX(-420px); }
    100% { transform: translateX(1250px); }
  }
  /* 随步伐上下轻浮（内层分组，避免与 cruise 的 transform 冲突） */
  .gator-bob {
    animation: bob 0.7s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  /* 尾巴摆动 */
  .tail {
    transform-origin: 300px 250px;
    animation: tail-wag 1.4s ease-in-out infinite;
  }
  @keyframes tail-wag {
    0%, 100% { transform: rotate(4deg); }
    50%      { transform: rotate(-6deg); }
  }

  /* 四肢交替摆动（以肩/髋为轴心） */
  .leg-fl { transform-origin: 430px 268px; animation: step 0.7s ease-in-out infinite; }
  .leg-fr { transform-origin: 470px 268px; animation: step 0.7s ease-in-out infinite -0.35s; }
  .leg-bl { transform-origin: 340px 265px; animation: step 0.7s ease-in-out infinite -0.35s; }
  .leg-br { transform-origin: 375px 265px; animation: step 0.7s ease-in-out infinite; }
  @keyframes step {
    0%, 100% { transform: rotate(14deg); }
    50%      { transform: rotate(-14deg); }
  }

  /* 下颚开合 */
  .jaw {
    transform-origin: 588px 236px;
    animation: snap 4.2s ease-in-out infinite;
  }
  @keyframes snap {
    0%, 60%, 100% { transform: rotate(0deg); }
    66%           { transform: rotate(9deg); }
    72%           { transform: rotate(2deg); }
    78%           { transform: rotate(7deg); }
    84%           { transform: rotate(0deg); }
  }

  /* 眨眼 */
  .eyelid {
    transform-origin: 552px 208px;
    animation: blink 5s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(0); }
    93%, 96%      { transform: scaleY(1); }
  }

  /* 水面波纹平移 */
  .ripple-a { animation: drift 7s linear infinite; }
  .ripple-b { animation: drift 11s linear infinite reverse; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-160px); }
  }

  /* 落日微光 */
  .sun-glow { animation: glow 6s ease-in-out infinite; transform-origin: 850px 150px; }
  @keyframes glow {
    0%, 100% { transform: scale(1); opacity: .55; }
    50%      { transform: scale(1.12); opacity: .8; }
  }

  /* 飞鸟 */
  .bird { animation: fly 18s linear infinite; }
  .bird2 { animation: fly 23s linear infinite -9s; }
  @keyframes fly {
    0%   { transform: translate(-100px, 0); }
    50%  { transform: translate(600px, -25px); }
    100% { transform: translate(1300px, 10px); }
  }
  .wing { animation: flap 0.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes flap {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(-0.6); }
  }

  /* 芦苇摆动 */
  .reed { transform-box: fill-box; transform-origin: bottom center; animation: sway 3.2s ease-in-out infinite; }
  .reed:nth-of-type(2) { animation-delay: -0.8s; }
  .reed:nth-of-type(3) { animation-delay: -1.6s; }
  .reed:nth-of-type(4) { animation-delay: -2.2s; }
  @keyframes sway {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(4deg); }
  }

  /* 气泡 */
  .bubble { animation: rise 3s ease-in infinite; opacity: 0; }
  .bubble:nth-of-type(2) { animation-delay: 1s; }
  .bubble:nth-of-type(3) { animation-delay: 2s; }
  @keyframes rise {
    0%   { transform: translateY(0); opacity: 0; }
    15%  { opacity: .7; }
    100% { transform: translateY(-46px); opacity: 0; }
  }

  /* 水面鳄鱼探头（远景剪影） */
  .lurk { animation: lurk 9s ease-in-out infinite; }
  @keyframes lurk {
    0%, 100% { transform: translateY(14px); }
    40%      { transform: translateY(-2px); }
    60%      { transform: translateY(-2px); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage">
  <h1>沼 泽 黄 昏 · 散 步 的 鳄 鱼</h1>
  <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="黄昏沼泽中一只鳄鱼边走边摆尾开口的动画">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#2b1b4d"/>
        <stop offset="45%" stop-color="#b64a7a"/>
        <stop offset="78%" stop-color="#f6a35c"/>
        <stop offset="100%" stop-color="#ffd9a0"/>
      </linearGradient>
      <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#e8b87e" stop-opacity=".55"/>
        <stop offset="18%" stop-color="#3a5f7d"/>
        <stop offset="100%" stop-color="#0f2436"/>
      </linearGradient>
      <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
        <stop offset="0%"  stop-color="#fff7d6"/>
        <stop offset="70%" stop-color="#ffce6b"/>
        <stop offset="100%" stop-color="#ffab4d"/>
      </radialGradient>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#5c8a3c"/>
        <stop offset="55%" stop-color="#3f6b2e"/>
        <stop offset="100%" stop-color="#2c4d22"/>
      </linearGradient>
      <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d9c978"/>
        <stop offset="100%" stop-color="#b8a35a"/>
      </linearGradient>
      <clipPath id="waterClip">
        <rect x="0" y="402" width="1000" height="158"/>
      </clipPath>
    </defs>

    <!-- ===== 天空 ===== -->
    <rect x="0" y="0" width="1000" height="410" fill="url(#sky)"/>

    <!-- 落日 -->
    <g>
      <circle class="sun-glow" cx="850" cy="150" r="78" fill="#ffb45c" opacity=".55"/>
      <circle cx="850" cy="150" r="46" fill="url(#sunCore)"/>
    </g>

    <!-- 远景树线剪影 -->
    <path d="M0 340 L40 328 L60 344 L100 320 L140 342 L170 330 L210 348 L260 326 L300 346 L350 334 L400 350 L700 350 L760 336 L820 350 L880 330 L940 348 L1000 338 L1000 410 L0 410 Z"
          fill="#221631" opacity=".85"/>

    <!-- 飞鸟 -->
    <g class="bird" fill="none" stroke="#2b1b4d" stroke-width="3" stroke-linecap="round">
      <path class="wing" d="M120 90 q12 -14 24 0 q12 -14 24 0"/>
    </g>
    <g class="bird2" fill="none" stroke="#3a2450" stroke-width="2.5" stroke-linecap="round">
      <path class="wing" d="M60 130 q9 -11 18 0 q9 -11 18 0"/>
    </g>

    <!-- ===== 水面 ===== -->
    <rect x="0" y="402" width="1000" height="158" fill="url(#waterGrad)"/>

    <!-- 落日倒影 -->
    <g clip-path="url(#waterClip)" opacity=".5">
      <rect x="820" y="406" width="60" height="6" rx="3" fill="#ffce6b"/>
      <rect x="828" y="420" width="44" height="5" rx="2.5" fill="#ffb45c"/>
      <rect x="822" y="434" width="56" height="5" rx="2.5" fill="#ff9d4d" opacity=".8"/>
      <rect x="834" y="448" width="34" height="4" rx="2" fill="#ff8f45" opacity=".6"/>
      <rect x="826" y="462" width="48" height="4" rx="2" fill="#ff8f45" opacity=".45"/>
    </g>

    <!-- 波纹 -->
    <g stroke="#7fb4d8" stroke-width="2.5" fill="none" opacity=".4">
      <path class="ripple-a" d="M-160 430 q20 -7 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
      <path class="ripple-b" d="M-160 470 q24 -8 48 0 t48 0 t48 0 t48 0 t48 0 t48 0 t48 0 t48 0 t48 0 t48 0 t48 0 t48 0 t48 0"/>
      <path class="ripple-a" d="M-160 505 q28 -9 56 0 t56 0 t56 0 t56 0 t56 0 t56 0 t56 0 t56 0 t56 0 t56 0"/>
    </g>

    <!-- 远景水中鳄鱼剪影（探头-下沉循环） -->
    <g class="lurk" fill="#16283a">
      <path d="M120 418 q14 -16 30 -4 q10 8 26 6 l40 -6 q8 8 -6 12 l-60 10 q-20 2 -30 -18 Z"/>
      <circle cx="150" cy="410" r="3.5" fill="#0f2436"/>
      <ellipse cx="145" cy="424" rx="60" ry="7" opacity=".6"/>
    </g>

    <!-- ===== 鳄鱼主角 ===== -->
    <g class="gator-cruise">
      <g class="gator-bob">

        <!-- 倒影（贴地模糊感用半透明压缩形） -->
        <g opacity=".18" transform="translate(0 560) scale(1 -0.22)">
          <path d="M300 250 q-70 -6 -120 30 q60 4 90 -6 l30 10 Z" fill="#0a1520"/>
          <ellipse cx="430" cy="255" rx="170" ry="46" fill="#0a1520"/>
        </g>

        <!-- 尾巴 -->
        <g class="tail">
          <path d="M310 246 Q225 236 168 276 Q142 294 112 292 Q146 308 186 300 Q246 290 316 272 Z"
                fill="url(#bodyGrad)" stroke="#24401b" stroke-width="2"/>
          <!-- 尾鳍棱 -->
          <path d="M212 258 q14 -12 30 -6 q-10 10 -30 6 Z" fill="#2c4d22"/>
          <path d="M160 274 q12 -10 26 -6 q-8 10 -26 6 Z" fill="#2c4d22"/>
        </g>

        <!-- 后侧腿（远侧，颜色更深） -->
        <g class="leg-br" fill="#2f5324" stroke="#22401a" stroke-width="2">
          <path d="M368 258 q-8 34 4 58 q10 8 20 4 q-4 -14 -2 -26 q4 -18 0 -34 Z"/>
          <path d="M368 318 q10 -6 24 -2 q10 4 0 8 q-14 4 -24 -6 Z"/>
        </g>
        <g class="leg-fr" fill="#2f5324" stroke="#22401a" stroke-width="2">
          <path d="M466 260 q-6 30 6 52 q10 6 18 2 q-4 -12 -2 -22 q4 -16 0 -30 Z"/>
          <path d="M466 312 q10 -6 22 -2 q8 4 0 8 q-12 4 -22 -6 Z"/>
        </g>

        <!-- 身体 -->
        <g>
          <path d="M312 262 Q310 214 380 200 Q470 184 560 206 Q606 218 634 236 L672 244 Q690 248 690 254 Q690 260 672 262 L636 266 Q612 288 556 296 Q470 310 384 300 Q322 292 312 262 Z"
                fill="url(#bodyGrad)" stroke="#24401b" stroke-width="2.5"/>
          <!-- 腹部 -->
          <path d="M340 288 Q450 306 560 290 Q600 282 626 266 Q600 298 548 304 Q452 314 366 300 Q344 296 340 288 Z"
                fill="url(#bellyGrad)" opacity=".9"/>
          <!-- 背脊鳞甲 -->
          <g fill="#2c4d22" stroke="#22401a" stroke-width="1.5">
            <path d="M352 206 l12 -14 l12 12 Z"/>
            <path d="M392 197 l12 -15 l12 13 Z"/>
            <path d="M434 192 l12 -15 l12 14 Z"/>
            <path d="M476 194 l11 -14 l12 14 Z"/>
            <path d="M516 200 l11 -13 l11 14 Z"/>
          </g>
          <!-- 体侧斑纹 -->
          <g fill="none" stroke="#2f5324" stroke-width="6" stroke-linecap="round" opacity=".7">
            <path d="M372 240 q16 8 30 2"/>
            <path d="M426 232 q16 8 30 2"/>
            <path d="M480 234 q16 8 30 2"/>
            <path d="M534 244 q14 8 26 2"/>
          </g>
        </g>

        <!-- 下颚（开合） -->
        <g class="jaw">
          <path d="M588 236 Q640 240 688 252 Q694 258 684 264 Q640 274 590 268 Q576 254 588 236 Z"
                fill="#3f6b2e" stroke="#24401b" stroke-width="2.5"/>
          <!-- 下齿 -->
          <g fill="#f5efdc">
            <path d="M624 252 l4 8 l4 -8 Z"/>
            <path d="M648 255 l4 8 l4 -8 Z"/>
            <path d="M672 258 l3.5 7 l3.5 -7 Z"/>
          </g>
        </g>

        <!-- 上颚齿与鼻 -->
        <g fill="#f5efdc">
          <path d="M640 244 l4 -9 l4 9 Z"/>
          <path d="M664 247 l3.5 -8 l3.5 8 Z"/>
        </g>
        <!-- 鼻孔 -->
        <ellipse cx="676" cy="240" rx="4" ry="2.6" fill="#22401a"/>

        <!-- 眼睛 -->
        <g>
          <circle cx="552" cy="210" r="12" fill="#f2d98c" stroke="#24401b" stroke-width="2"/>
          <circle cx="555" cy="210" r="5" fill="#1d1408"/>
          <circle cx="557" cy="208" r="1.6" fill="#fff"/>
          <!-- 眼睑 -->
          <path class="eyelid" d="M540 210 a12 12 0 0 1 24 0 Z" fill="#3f6b2e" stroke="#24401b" stroke-width="1.5"/>
        </g>
        <!-- 眼后腺脊 -->
        <path d="M528 200 q10 -12 26 -6" fill="none" stroke="#2c4d22" stroke-width="4" stroke-linecap="round"/>

        <!-- 前侧腿（近侧） -->
        <g class="leg-bl" fill="#4d7a35" stroke="#24401b" stroke-width="2">
          <path d="M334 258 q-10 36 4 62 q12 8 24 2 q-6 -16 -4 -28 q6 -20 2 -34 Z"/>
          <path d="M334 320 q12 -8 28 -3 q10 5 0 10 q-16 5 -28 -7 Z"/>
          <g stroke="#24401b" stroke-width="1.6" fill="none">
            <path d="M340 327 l-5 6"/><path d="M350 329 l-3 7"/><path d="M358 328 l0 7"/>
          </g>
        </g>
        <g class="leg-fl" fill="#4d7a35" stroke="#24401b" stroke-width="2">
          <path d="M424 260 q-8 32 6 56 q12 7 22 2 q-5 -14 -3 -24 q5 -18 1 -32 Z"/>
          <path d="M426 316 q12 -8 26 -3 q9 5 0 9 q-15 5 -26 -6 Z"/>
          <g stroke="#24401b" stroke-width="1.6" fill="none">
            <path d="M432 323 l-5 6"/><path d="M442 325 l-3 6"/><path d="M450 324 l0 6"/>
          </g>
        </g>

        <!-- 水面溅花（脚边，闪动） -->
        <g fill="none" stroke="#bfe0f2" stroke-width="2" stroke-linecap="round" opacity=".6">
          <path d="M410 336 q10 -4 20 0"/>
          <path d="M330 340 q10 -4 20 0"/>
        </g>
      </g>
    </g>

    <!-- 气泡（水中） -->
    <g fill="none" stroke="#9fd0ea" stroke-width="2">
      <circle class="bubble" cx="760" cy="480" r="5"/>
      <circle class="bubble" cx="775" cy="490" r="3.5"/>
      <circle class="bubble" cx="752" cy="496" r="4"/>
    </g>

    <!-- ===== 前景芦苇 ===== -->
    <g>
      <g class="reed">
        <path d="M40 560 Q34 470 48 420" stroke="#1d3321" stroke-width="6" fill="none" stroke-linecap="round"/>
        <ellipse cx="50" cy="416" rx="6" ry="16" fill="#4a3b23"/>
      </g>
      <g class="reed">
        <path d="M78 560 Q86 480 74 438" stroke="#16281a" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M78 500 q-22 -8 -30 -26 q20 0 32 16 Z" fill="#1d3321"/>
      </g>
      <g class="reed">
        <path d="M932 560 Q940 462 924 410" stroke="#1d3321" stroke-width="6" fill="none" stroke-linecap="round"/>
        <ellipse cx="923" cy="406" rx="6" ry="15" fill="#4a3b23"/>
      </g>
      <g class="reed">
        <path d="M965 560 Q958 490 972 444" stroke="#16281a" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M965 510 q20 -10 26 -30 q-18 2 -28 20 Z" fill="#1d3321"/>
      </g>
    </g>

    <!-- 前景水岸 -->
    <path d="M0 540 Q120 528 260 538 Q420 548 600 536 Q800 524 1000 540 L1000 560 L0 560 Z" fill="#0c1b26"/>
  </svg>
</div>
</body>
</html>
