[pytest]
testpaths = tests tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    blackbox: black-box API tests requiring running backend
    whitebox: white-box unit tests
    e2e: end-to-end tests requiring running backend + frontend + browser
    reap_workers: 用例结束后回收残留的异步 worker 线程（适用于会 fire-and-forget
        起任务、且依赖“下一个用例的库不被后台线程写入”的用例）
