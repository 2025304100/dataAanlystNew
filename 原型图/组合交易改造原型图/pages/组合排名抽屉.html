  --pt-state-success: #10b981;

  --pt-card: #111827;
  --pt-card-foreground: #f8fafc;

                        <span class="pt-text-md pt-font-medium text-white truncate">量化对冲组合</span>
                        <span class="tag-badge tag-real">实盘</span>
                    </div>
                    <div class="flex items-center gap-3 pt-text-xs pt-neutral">
                        <span class="flex items-center gap-1">
                            <i data-lucide="calendar" class="w-3 h-3"></i>
                            成立 120 天
                        </span>
                        <span class="flex items-center gap-1">
                            <i data-lucide="layers" class="w-3 h-3"></i>
                            11 只标的
                        </span>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <div class="pt-text-lg pt-font-bold pt-mono pt-negative metric-value" data-metric="return">-2.1%</div>
                    </div>
                    <button type="button" class="pt-btn pt-btn-secondary pt-btn-sm shrink-0">
                        查看
                    </button>
                </div>
            </div>
        </div>

        <!-- Bottom Action Bar -->
        <div class="flex items-center justify-between px-5 py-3.5"
             style="border-top: 1px solid var(--pt-border); background: var(--pt-surface-2);">
            <span class="pt-text-sm pt-neutral">共 8 个组合</span>
            <button type="button"
                    data-dom-id="btn-view-all"
                    class="pt-btn pt-btn-secondary">
                <span>查看全部</span>
                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
            </button>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        if (window.lucide) lucide.createIcons();

        // Tab switching data
        const metricsData = {
            return: {
                values: ['+35.2%', '+28.7%', '+22.1%', '+18.5%', '+12.3%', '+8.9%', '+3.2%', '-2.1%'],
                positive: [true, true, true, true, true, true, true, false]
            },
            drawdown: {
                values: ['-5.8%', '-8.2%', '-3.5%', '-12.1%', '-15.6%', '-6.4%', '-22.3%', '-4.2%'],
                positive: [false, false, false, false, false, false, false, false],
                // For drawdown, smaller (less negative) is better; use warning color for context
                isDrawdown: true
            },
            sharpe: {
                values: ['2.84', '2.15', '3.02', '1.68', '1.24', '1.93', '0.56', '0.89'],
                positive: [true, true, true, true, true, true, true, true],
                isSharpe: true
            }
        };

        // Tab switching logic
        const tabs = document.querySelectorAll('.pt-tab');
        const metricValues = document.querySelectorAll('.metric-value');

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                const tabType = this.getAttribute('data-tab');

                // Update tab active state
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');

                // Update metric values
                const data = metricsData[tabType];
                metricValues.forEach((el, idx) => {
                    el.textContent = data.values[idx];
                    el.classList.remove('pt-positive', 'pt-negative', 'pt-cyan');

                    if (data.isDrawdown) {
                        // Drawdown: all negative, use error color but rank by magnitude
                        el.classList.add('pt-negative');
                    } else if (data.isSharpe) {
                        // Sharpe ratio: use primary cyan color
                        el.classList.add('pt-cyan');
                    } else {
                        // Return rate
                        if (data.positive[idx]) {
                            el.classList.add('pt-positive');
                        } else {
                            el.classList.add('pt-negative');
                        }
                    }
                });
            });
        });

        // Close drawer functionality
        function closeDrawer() {
            const panel = document.getElementById('ranking-drawer');
            const scrim = document.getElementById('drawer-scrim');

            panel.style.transition = 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
            panel.style.transform = 'translateX(100%)';

            scrim.style.transition = 'opacity 0.2s ease-out';
            scrim.style.opacity = '0';

            setTimeout(() => {
                // For demo purposes, just show the closed state
                panel.style.display = 'none';
                scrim.style.display = 'none';
            }, 250);
        }

        document.getElementById('drawer-scrim').addEventListener('click', closeDrawer);
        document.querySelector('[data-dom-id="drawer-close-btn"]').addEventListener('click', closeDrawer);

        // Row click handler
        document.querySelectorAll('.ranking-row').forEach(row => {
            row.addEventListener('click', function(e) {
                // Don't trigger if clicking the "查看" button
                if (e.target.closest('.pt-btn')) return;
                // Row navigation could go here
                console.log('Navigate to portfolio:', this.getAttribute('data-dom-id'));
            });
        });
    </script>
</body>
</html>
