/* Portfolio Trading Redesign — Professional Calm Finance Theme */
/* Brand prefix: pt */

:root {
  /* Neutral scale */
  --pt-white: #ffffff;
  --pt-black: #000000;
  --pt-slate-50: #f8fafc;
  --pt-slate-100: #f1f5f9;

  --pt-slate-400: #94a3b8;
  --pt-slate-500: #64748b;
  --pt-slate-600: #475569;
  --pt-slate-700: #334155;
  --pt-slate-800: #1e293b;
  --pt-slate-900: #0f172a;
  --pt-slate-950: #020617;

  /* Primary cyan scale (single brand hue) */
  --pt-cyan-50: #ecfeff;
  --pt-cyan-100: #cffafe;
  --pt-cyan-200: #a5f3fc;
  --pt-cyan-300: #67e8f9;
  --pt-cyan-400: #22d3ee;
  --pt-cyan-500: #06b6d4;
  --pt-cyan-600: #0891b2;
  --pt-cyan-700: #0e7490;
  --pt-cyan-800: #155e75;
  --pt-cyan-900: #164e63;
  --pt-cyan-950: #083344;

  /* State colors (semantic only) */
  --pt-state-success: #10b981;
  --pt-state-success-dim: rgba(16, 185, 129, 0.12);
  --pt-state-warning: #f59e0b;
  --pt-state-warning-dim: rgba(245, 158, 11, 0.12);
  --pt-state-error: #ef4444;
  --pt-state-error-dim: rgba(239, 68, 68, 0.12);
  --pt-state-info: #3b82f6;
  --pt-state-info-dim: rgba(59, 130, 246, 0.12);

  /* Semantic aliases */
  --pt-background: #0b1120;
  --pt-foreground: #f8fafc;
  --pt-card: #111827;
  --pt-card-foreground: #f8fafc;
  --pt-popover: #111827;
  --pt-popover-foreground: #f8fafc;
  --pt-primary: #06b6d4;
  --pt-primary-foreground: #020617;
  --pt-muted: #1f2937;
  --pt-muted-foreground: #94a3b8;
  --pt-border: #374151;
  --pt-input: #1f2937;
  --pt-ring: #06b6d4;

  /* Radius scale (restrained) */
  --pt-radius-sm: 4px;
  --pt-radius-md: 8px;
  --pt-radius-lg: 12px;
  --pt-radius-full: 9999px;

  /* Surface depth */
  --pt-surface-1: #0b1120;
  --pt-surface-2: #111827;
  --pt-surface-3: #1f2937;
  --pt-surface-4: #27354f;

  /* Typography */
  --pt-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
  --pt-font-mono: "SF Mono", "SFMono-Regular", "Consolas", "Liberation Mono", "Menlo", "Courier New", monospace;

  /* Spacing scale */
  --pt-space-1: 4px;
  --pt-space-2: 8px;
  --pt-space-3: 12px;
  --pt-space-4: 16px;
  --pt-space-5: 20px;
  --pt-space-6: 24px;
  --pt-space-8: 32px;
  --pt-space-10: 40px;
  --pt-space-12: 48px;

  /* Shadows (only for floating layers, alpha <= 0.15) */
  --pt-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
  --pt-shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
  --pt-shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.35), 0 4px 6px -4px rgba(0, 0, 0, 0.25);
  --pt-shadow-glow: 0 0 20px rgba(6, 182, 212, 0.15);
}

/* Base typography classes */
.pt-text-xs { font-size: 11px; line-height: 16px; }
.pt-text-sm { font-size: 12px; line-height: 18px; }
.pt-text-base { font-size: 13px; line-height: 20px; }
.pt-text-md { font-size: 14px; line-height: 22px; }
.pt-text-lg { font-size: 16px; line-height: 24px; }
.pt-text-xl { font-size: 18px; line-height: 28px; }
.pt-text-2xl { font-size: 20px; line-height: 30px; }
.pt-text-3xl { font-size: 24px; line-height: 32px; }

.pt-font-normal { font-weight: 400; }
.pt-font-medium { font-weight: 500; }
.pt-font-semibold { font-weight: 600; }
.pt-font-bold { font-weight: 700; }

.pt-tracking-tight { letter-spacing: -0.01em; }
.pt-tracking-wide { letter-spacing: 0.03em; }

/* Utility color classes */
.pt-text-primary { color: var(--pt-foreground); }
.pt-text-secondary { color: var(--pt-muted-foreground); }
.pt-text-muted { color: var(--pt-slate-500); }
.pt-text-cyan { color: var(--pt-primary); }
.pt-text-success { color: var(--pt-state-success); }
.pt-text-warning { color: var(--pt-state-warning); }
.pt-text-error { color: var(--pt-state-error); }
.pt-text-info { color: var(--pt-state-info); }

.pt-bg-background { background-color: var(--pt-background); }
.pt-bg-card { background-color: var(--pt-card); }
.pt-bg-muted { background-color: var(--pt-muted); }

.pt-bg-primary-dim { background-color: rgba(6, 182, 212, 0.12); }
.pt-bg-success-dim { background-color: var(--pt-state-success-dim); }
.pt-bg-warning-dim { background-color: var(--pt-state-warning-dim); }

.pt-border { border-color: var(--pt-border); }

/* Financial data styling */

.pt-positive { color: var(--pt-state-success); }
.pt-negative { color: var(--pt-state-error); }
.pt-neutral { color: var(--pt-muted-foreground); }

                        周期轮动组合
                    </div>
                    <div class="pt-text-xs mt-0.5" style="color: var(--pt-slate-500);">
                        成立54天 · 9只
                    </div>
                </div>
                <div class="pt-mono pt-text-sm pt-font-semibold pt-positive" style="margin-right: 10px; flex-shrink: 0;">
                    +3.2%
                </div>
                <span class="pt-text-xs" style="padding: 2px 6px; border-radius: 4px; background: rgba(148, 163, 184, 0.15); color: var(--pt-slate-400); flex-shrink: 0;">模拟</span>
            </div>

        </div>

        <!-- Bottom Divider + Create Button -->
        <div style="border-top: 1px solid var(--pt-border); padding: 8px 12px 12px;">
            <button
                type="button"
                data-dom-id="btn-create-portfolio"
                class="w-full"
                style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 36px; background: transparent; border: 1px solid var(--pt-border); border-radius: var(--pt-radius-md); color: var(--pt-muted-foreground); cursor: pointer; transition: all 0.15s ease;"
                onmouseenter="this.style.background='var(--pt-surface-3)'; this.style.color='var(--pt-foreground)'; this.style.borderColor='var(--pt-slate-500)'"
                onmouseleave="this.style.background='transparent'; this.style.color='var(--pt-muted-foreground)'; this.style.borderColor='var(--pt-border)'"
            >
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span class="pt-text-sm pt-font-medium">新建组合</span>
            </button>
        </div>

    </div>

    <script>
        // Initialize Lucide icons
        if (window.lucide) lucide.createIcons();

        // Portfolio item click - toggle selection
        const portfolioItems = document.querySelectorAll('.portfolio-item');
        portfolioItems.forEach(item => {
            item.addEventListener('click', function() {
                // Remove selected state from all items
                portfolioItems.forEach(i => {
                    i.classList.remove('selected');
                    i.style.background = 'transparent';
                    // Remove left bar
                    const bar = i.querySelector('.selected-bar');
                    if (bar) bar.remove();
                    // Remove check icon
                    const checkContainer = i.querySelector('.check-container');
                    if (checkContainer) checkContainer.remove();
                    // Reset left padding
                    i.style.paddingLeft = '15px';
                });

                // Add selected state to clicked item
                this.classList.add('selected');
                this.style.background = 'rgba(6, 182, 212, 0.08)';
                this.style.paddingLeft = '0';

                // Add left cyan bar
                const bar = document.createElement('div');
                bar.className = 'selected-bar';
                bar.style.cssText = 'position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: var(--pt-primary); border-radius: 0 2px 2px 0;';
                this.insertBefore(bar, this.firstChild);

                // Add padding to first child (info div)
                const infoDiv = this.querySelector('div[style*="flex: 1"]');
                if (infoDiv) {
                    infoDiv.style.marginLeft = '12px';
                }

                // Add check icon next to tag
                const tagSpan = this.querySelector('span[style*="padding: 2px 6px"]');
                if (tagSpan && !this.querySelector('.check-container')) {
                    const checkWrapper = document.createElement('div');
                    checkWrapper.className = 'check-container';
                    checkWrapper.style.cssText = 'display: flex; align-items: center; gap: 6px; flex-shrink: 0;';
                    const checkIcon = document.createElement('i');
                    checkIcon.setAttribute('data-lucide', 'check');
                    checkIcon.className = 'w-4 h-4';
                    checkIcon.style.color = 'var(--pt-primary)';
                    checkWrapper.appendChild(tagSpan.cloneNode(true));
                    checkWrapper.appendChild(checkIcon);
                    tagSpan.parentNode.replaceChild(checkWrapper, tagSpan);
                    if (window.lucide) lucide.createIcons();
                }
            });
        });

        // Search functionality
        const searchInput = document.querySelector('[data-dom-id="portfolio-search"]');
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            portfolioItems.forEach(item => {
                const name = item.querySelector('.pt-text-sm').textContent.toLowerCase();
                if (name.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        });

        // Create portfolio button
        document.querySelector('[data-dom-id="btn-create-portfolio"]').addEventListener('click', function() {
            console.log('Create new portfolio clicked');
        });
    </script>
</body>
</html>
