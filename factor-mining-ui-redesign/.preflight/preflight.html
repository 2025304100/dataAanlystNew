<!doctype html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
:root {
  /* Brand: deep teal — professional, calm, data-driven */
  --fm-brand-50: #f0fdfa;
  --fm-brand-100: #ccfbf1;
  --fm-brand-200: #99f6e4;
  --fm-brand-300: #5eead4;
  --fm-brand-400: #2dd4bf;
  --fm-brand-500: #14b8a6;
  --fm-brand-600: #0d9488;
  --fm-brand-700: #0f766e;
  --fm-brand-800: #115e59;
  --fm-brand-900: #134e4a;

  /* Neutral: warm slate for less clinical feel */
  --fm-neutral-0: #ffffff;
  --fm-neutral-50: #fafaf9;
  --fm-neutral-100: #f5f5f4;
  --fm-neutral-200: #e7e5e4;
  --fm-neutral-300: #d6d3d1;
  --fm-neutral-400: #a8a29e;
  --fm-neutral-500: #78716c;
  --fm-neutral-600: #57534e;
  --fm-neutral-700: #44403c;
  --fm-neutral-800: #292524;
  --fm-neutral-900: #1c1917;

  /* Semantic state colors */
  --fm-success: #15803d;
  --fm-success-soft: #dcfce7;
  --fm-info: #1d6fd8;
  --fm-info-soft: #dbeafe;
  --fm-warn: #b45309;
  --fm-warn-soft: #ffedd5;
  --fm-danger: #b42318;
  --fm-danger-soft: #fee2e2;

  /* Grade palette */
  --fm-grade-s: #0b6b63;
  --fm-grade-a: #1d6fd8;
  --fm-grade-b: #b45309;
  --fm-grade-c: #c2410c;
  --fm-grade-d: #b42318;

  /* Core semantic theme — required by head contract */
  --fm-background: var(--fm-neutral-50);
  --fm-foreground: var(--fm-neutral-900);
  --fm-card: var(--fm-neutral-0);
  --fm-card-foreground: var(--fm-neutral-800);
  --fm-popover: var(--fm-neutral-0);
  --fm-popover-foreground: var(--fm-neutral-800);
  --fm-primary: var(--fm-brand-700);
  --fm-primary-foreground: var(--fm-neutral-0);
  --fm-muted: var(--fm-neutral-100);
  --fm-muted-foreground: var(--fm-neutral-500);
  --fm-border: var(--fm-neutral-200);
  --fm-input: var(--fm-neutral-200);
  --fm-ring: var(--fm-brand-500);

  /* Radius scale */
  --fm-radius-sm: 6px;
  --fm-radius-md: 10px;
  --fm-radius-lg: 14px;
  --fm-radius-xl: 18px;
  --fm-radius-pill: 999px;

  /* Typography */
  --fm-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  --fm-font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, "Cascadia Mono", monospace;

  /* Type scale */
  --fm-text-xs: 11px;
  --fm-text-sm: 12px;
  --fm-text-base: 13px;
  --fm-text-md: 14px;
  --fm-text-lg: 16px;
  --fm-text-xl: 18px;
  --fm-text-2xl: 22px;
  --fm-text-3xl: 28px;

  /* Spacing scale */
  --fm-space-1: 4px;
  --fm-space-2: 6px;
  --fm-space-3: 8px;
  --fm-space-4: 12px;
  --fm-space-5: 16px;
  --fm-space-6: 20px;
  --fm-space-7: 24px;
  --fm-space-8: 32px;
  --fm-space-9: 40px;

  /* Shadow scale */
  --fm-shadow-xs: 0 1px 2px rgba(28, 25, 23, 0.04);
  --fm-shadow-sm: 0 1px 3px rgba(28, 25, 23, 0.06), 0 1px 2px rgba(28, 25, 23, 0.04);
  --fm-shadow-md: 0 4px 12px rgba(28, 25, 23, 0.06), 0 2px 4px rgba(28, 25, 23, 0.04);
  --fm-shadow-lg: 0 12px 32px rgba(28, 25, 23, 0.08), 0 4px 8px rgba(28, 25, 23, 0.04);

  /* Layout */
  --fm-sidebar-width: 232px;
  --fm-header-height: 56px;
}

html.light {
  color-scheme: light;
}

html.dark {
  color-scheme: dark;
}

body {
  font-family: var(--fm-font-sans);
  font-size: var(--fm-text-base);
  line-height: 1.5;
  color: var(--fm-foreground);
  background: var(--fm-background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* High-level primitives */
.fm-surface {
  background: var(--fm-card);
  border: 1px solid var(--fm-border);
  border-radius: var(--fm-radius-md);
  box-shadow: var(--fm-shadow-sm);
}

.fm-surface-elevated {
  background: var(--fm-card);
  border: 1px solid var(--fm-border);
  border-radius: var(--fm-radius-lg);
  box-shadow: var(--fm-shadow-md);
}

.fm-title-1 {
  font-size: var(--fm-text-2xl);
  font-weight: 700;
  line-height: 1.25;
  color: var(--fm-foreground);
  letter-spacing: -0.01em;
}

.fm-title-2 {
  font-size: var(--fm-text-xl);
  font-weight: 600;
  line-height: 1.3;
  color: var(--fm-foreground);
}

.fm-title-3 {
  font-size: var(--fm-text-lg);
  font-weight: 600;
  line-height: 1.35;
  color: var(--fm-foreground);
}

.fm-label {
  font-size: var(--fm-text-sm);
  font-weight: 500;
  color: var(--fm-neutral-700);
}

.fm-caption {
  font-size: var(--fm-text-xs);
  color: var(--fm-muted-foreground);
  line-height: 1.45;
}

.fm-text-muted {
  color: var(--fm-muted-foreground);
}

.fm-mono {
  font-family: var(--fm-font-mono);
  font-variant-numeric: tabular-nums;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--fm-background);
    --color-foreground: var(--fm-foreground);
    --color-card: var(--fm-card);
    --color-card-foreground: var(--fm-card-foreground);
    --color-popover: var(--fm-popover);
    --color-popover-foreground: var(--fm-popover-foreground);
    --color-primary: var(--fm-primary);
    --color-primary-foreground: var(--fm-primary-foreground);
    --color-muted: var(--fm-muted);
    --color-muted-foreground: var(--fm-muted-foreground);
    --color-border: var(--fm-border);
    --color-input: var(--fm-input);
    --color-ring: var(--fm-ring);
    --radius-sm: var(--fm-radius-sm);
    --radius-md: var(--fm-radius-md);
    --radius-lg: var(--fm-radius-lg);
    --radius-xl: var(--fm-radius-xl);
  }
  @layer base {
    body { background: var(--fm-background); color: var(--fm-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--fm-background); }
      .text-background { color: var(--fm-background); }
      .border-background { border-color: var(--fm-background); }
      .ring-background { --tw-ring-color: var(--fm-background); }
      .bg-foreground { background-color: var(--fm-foreground); }
      .text-foreground { color: var(--fm-foreground); }
      .border-foreground { border-color: var(--fm-foreground); }
      .ring-foreground { --tw-ring-color: var(--fm-foreground); }
      .bg-card { background-color: var(--fm-card); }
      .text-card { color: var(--fm-card); }
      .border-card { border-color: var(--fm-card); }
      .ring-card { --tw-ring-color: var(--fm-card); }
      .bg-card-foreground { background-color: var(--fm-card-foreground); }
      .text-card-foreground { color: var(--fm-card-foreground); }
      .border-card-foreground { border-color: var(--fm-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--fm-card-foreground); }
      .bg-popover { background-color: var(--fm-popover); }
      .text-popover { color: var(--fm-popover); }
      .border-popover { border-color: var(--fm-popover); }
      .ring-popover { --tw-ring-color: var(--fm-popover); }
      .bg-popover-foreground { background-color: var(--fm-popover-foreground); }
      .text-popover-foreground { color: var(--fm-popover-foreground); }
      .border-popover-foreground { border-color: var(--fm-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--fm-popover-foreground); }
      .bg-primary { background-color: var(--fm-primary); }
      .text-primary { color: var(--fm-primary); }
      .border-primary { border-color: var(--fm-primary); }
      .ring-primary { --tw-ring-color: var(--fm-primary); }
      .bg-primary-foreground { background-color: var(--fm-primary-foreground); }
      .text-primary-foreground { color: var(--fm-primary-foreground); }
      .border-primary-foreground { border-color: var(--fm-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--fm-primary-foreground); }
      .bg-muted { background-color: var(--fm-muted); }
      .text-muted { color: var(--fm-muted); }
      .border-muted { border-color: var(--fm-muted); }
      .ring-muted { --tw-ring-color: var(--fm-muted); }
      .bg-muted-foreground { background-color: var(--fm-muted-foreground); }
      .text-muted-foreground { color: var(--fm-muted-foreground); }
      .border-muted-foreground { border-color: var(--fm-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--fm-muted-foreground); }
      .bg-border { background-color: var(--fm-border); }
      .text-border { color: var(--fm-border); }
      .border-border { border-color: var(--fm-border); }
      .ring-border { --tw-ring-color: var(--fm-border); }
      .bg-input { background-color: var(--fm-input); }
      .text-input { color: var(--fm-input); }
      .border-input { border-color: var(--fm-input); }
      .ring-input { --tw-ring-color: var(--fm-input); }
      .bg-ring { background-color: var(--fm-ring); }
      .text-ring { color: var(--fm-ring); }
      .border-ring { border-color: var(--fm-ring); }
      .ring-ring { --tw-ring-color: var(--fm-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <main>
    <h1>Preflight</h1>
    <button class="fm-btn">Button</button>
  </main>
</body>
</html>
